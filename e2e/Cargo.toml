[package]
name = "steward-e2e"
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95"
version = "0.0.0"

[workspace]

[[test]]
name = "s0"
path = "s0.rs"

[[test]]
name = "s1"
path = "s1.rs"

[[test]]
name = "s2_store"
path = "s2_store.rs"

[[test]]
name = "s2"
path = "s2.rs"

[[test]]
name = "s3_store"
path = "s3_store.rs"

[[test]]
name = "s3"
path = "s3.rs"

[[test]]
name = "s4_store"
path = "s4_store.rs"

[[test]]
name = "s4"
path = "s4.rs"

[[test]]
name = "s5"
path = "s5.rs"

[[test]]
name = "task"
path = "task.rs"

[[test]]
name = "openshell_adapter_v0098"
path = "openshell_adapter_v0098.rs"

[[test]]
name = "postgres_tls"
path = "postgres_tls.rs"

[[test]]
name = "governed_connections"
path = "governed_connections.rs"

[[bin]]
name = "s3-server"
path = "s3_server.rs"

[[bin]]
name = "s4-server"
path = "s4_server.rs"

[[bin]]
name = "task-server"
path = "task_server.rs"

[dependencies]
axum = "0.8"
kube = { version = "4.2.0", default-features = false, features = ["client", "ring", "rustls-tls"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["postgres", "runtime-tokio"] }
steward-admission = { path = "../crates/steward-admission", version = "=0.0.0" }
steward-adapter-jira = { path = "../adapters/jira", version = "=0.0.0" } # Exercises the real Jira decision-channel adapter in the S4 full-stack test.
steward-adapter-openshell = { path = "../adapters/openshell", version = "=0.0.0", features = ["runtime"] }
steward-apiserver = { path = "../crates/steward-apiserver", version = "=0.0.0" }
steward-controller = { path = "../crates/steward-controller", version = "=0.0.0" }
steward-store = { path = "../crates/steward-store", version = "=0.0.0" }
steward-ports = { path = "../crates/steward-ports", version = "=0.0.0" }
steward-types = { path = "../crates/steward-types", version = "=0.0.0" }
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
