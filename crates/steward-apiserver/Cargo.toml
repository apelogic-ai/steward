[package]
name = "steward-apiserver"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
admin-demo = []

[dependencies]
axum.workspace = true
jsonwebtoken.workspace = true
k8s-openapi.workspace = true
kube = { workspace = true, features = ["client", "ring", "rustls-tls"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest.workspace = true
steward-admission = { path = "../steward-admission", version = "=0.0.0" }
steward-ports = { path = "../steward-ports", version = "=0.0.0" }
steward-store = { path = "../steward-store", version = "=0.0.0" }
steward-types = { path = "../steward-types", version = "=0.0.0" }
utoipa.workspace = true
uuid.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["signal"] }
tower.workspace = true

[[example]]
name = "admin-dashboard-demo"
path = "examples/admin-dashboard-demo.rs"
required-features = ["admin-demo"]

[[example]]
name = "fast-track-connections-bridge"
path = "examples/fast-track-connections-bridge.rs"
required-features = ["admin-demo"]

[[example]]
name = "fast-track-steward-preview"
path = "examples/fast-track-steward-preview.rs"
required-features = ["admin-demo"]

[lints]
workspace = true
