[workspace]
resolver = "2"
exclude = ["conformance", "e2e"]
members = [
    "adapters/fake",
    "adapters/jira",
    "adapters/litellm",
    "adapters/mcp-gw",
    "adapters/opa",
    "adapters/openshell",
    "adapters/spire",
    "bins/steward-controller",
    "bins/steward-apiserver",
    "bins/steward-mint",
    "crates/steward-admission",
    "crates/steward-apiserver",
    "crates/steward-controller",
    "crates/steward-mint",
    "crates/steward-ports",
    "crates/steward-store",
    "crates/steward-types",
    "xtask",
]

[workspace.package]
edition = "2024"
license = "Apache-2.0"
publish = false
rust-version = "1.95"
version = "0.0.0"

[workspace.dependencies]
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
futures = "0.3.33"
jwt-compact = { version = "0.8.0", default-features = false, features = ["clock", "ed25519-dalek", "std"] }
k8s-openapi = { version = "0.28.0", features = ["schemars", "v1_32"] }
kube = { version = "4.2.0", default-features = false }
# Jira's adapter needs one rustls-backed HTTPS/JSON client for outbound REST calls.
reqwest = { version = "0.12.28", default-features = false, features = ["json", "rustls-tls"] }
rand_core = { version = "0.6.4", features = ["getrandom"] }
schemars = "1.2.1"
serde = { version = "1", features = ["derive"] }
serde-saphyr = "0.0.29"
serde_json = "1"
sha2 = "0.10"
spiffe = { version = "0.16.0", default-features = false, features = ["workload-api-jwt"] }
sqlx = { version = "0.8", default-features = false, features = ["json", "macros", "migrate", "postgres", "runtime-tokio", "tls-rustls-ring-native-roots", "uuid"] }
tokio = { version = "1.43", features = ["macros", "net", "rt-multi-thread"] }
# Production admission endpoints terminate Kubernetes-compatible TLS.
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
# The SPIRE adapter classifies gRPC credential failures separately from service outages.
tonic = "0.14.6"
tower = { version = "0.5", features = ["util"] }
utoipa = "5"
uuid = { version = "1", features = ["serde", "v4"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
expect_used = "deny"
panic = "deny"
unwrap_used = "deny"
