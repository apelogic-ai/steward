id: steward-litellm
display_name: Steward deterministic inference fixture
description: Runtime-scoped deterministic Responses fixture for the local Task E2E
category: inference
inference_capable: true
credentials:
  - name: api_key
    description: Runtime-bound inference credential
    required: false
    auth_style: bearer
    header_name: Authorization
    token_grant:
      token_endpoint: http://steward-mint.steward-system.svc.cluster.local:8080/token
      audience: steward-inference
      jwt_svid_audience: steward-mint
      client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
      scopes: [inference]
      cache_ttl_seconds: 2
endpoints:
  - host: litellm-litellm.litellm.svc.cluster.local
    port: 4000
    protocol: rest
    tls: none
    access: read-write
    enforcement: enforce
    allowed_ips:
      - SERVICE_SUBNET
binaries:
  - /usr/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/aarch64-unknown-linux-musl/codex/codex
  - /usr/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/codex/codex
  - /usr/bin/curl
  - /usr/local/bin/curl
