id: steward-mcp-gw-v1-3-0
display_name: Steward Task MCP gateway 1.3.0
description: Immutable runtime-scoped MCP policy for the local Task E2E
category: source_control
credentials:
  - name: access_token
    description: Short-lived HOP-1 derived from the sandbox JWT-SVID
    required: false
    auth_style: bearer
    header_name: Authorization
    token_grant:
      token_endpoint: http://hop1-capture-tools.steward-system.svc.cluster.local:8085/token-tools
      audience: steward-mcp
      jwt_svid_audience: steward-mint
      client_assertion_type: urn:ietf:params:oauth:client-assertion-type:jwt-spiffe
      scopes: [mcp]
      cache_ttl_seconds: 2
endpoints:
  - host: hop1-capture-tools.steward-system.svc.cluster.local
    port: 8085
    protocol: rest
    tls: none
    access: read-write
    enforcement: enforce
    allowed_ips:
      - SERVICE_SUBNET
binaries:
  - /usr/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-arm64/vendor/aarch64-unknown-linux-musl/bin/codex
  - /usr/lib/node_modules/@openai/codex/node_modules/@openai/codex-linux-x64/vendor/x86_64-unknown-linux-musl/bin/codex
  - /usr/bin/curl
  - /usr/local/bin/curl
