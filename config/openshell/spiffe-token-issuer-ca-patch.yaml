apiVersion: apps/v1
kind: Deployment
metadata:
  name: token-issuer
  namespace: default
spec:
  template:
    spec:
      containers:
        - name: token-issuer
          env:
            - name: NODE_EXTRA_CA_CERTS
              value: /var/run/spire-oidc-ca/ca.pem
          volumeMounts:
            - name: spire-oidc-ca
              mountPath: /var/run/spire-oidc-ca
              readOnly: true
      volumes:
        - name: spire-oidc-ca
          configMap:
            name: openshell-spire-oidc-ca
