apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: steward-s5-mint-tools
spec:
  spiffeIDTemplate: spiffe://openshell.local/steward/mint-tools
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: steward-system
  podSelector:
    matchLabels:
      app: steward-s5-mint-tools
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steward-mint-tools
  namespace: steward-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steward-s5-mint-tools
  template:
    metadata:
      labels:
        app: steward-s5-mint-tools
    spec:
      serviceAccountName: steward-mint
      containers:
        - name: mint
          image: steward/mint:s1
          imagePullPolicy: Never
          env:
            - name: SPIFFE_ENDPOINT_SOCKET
              value: unix:///spiffe-workload-api/spire-agent.sock
            - name: STEWARD_AUTHORITY_TTL
              value: "10"
            - name: STEWARD_MINT_ALLOWED_SCOPES
              value: mcp
            - name: STEWARD_MINT_AUDIENCE
              value: steward-mcp
            - name: STEWARD_MINT_BIND
              value: 0.0.0.0:8080
            - name: STEWARD_MINT_ISSUER
              value: http://steward-mint-tools.steward-system.svc.cluster.local:8080
            - name: STEWARD_MINT_SVID_AUDIENCE
              value: steward-mint
            - name: STEWARD_MINT_INTROSPECTION_CLIENT_CREDENTIAL_FILE
              value: /run/steward/introspection-client
            - name: STEWARD_MINT_SIGNING_KEY_FILE
              value: /run/steward/signing-key
            - name: STEWARD_OPENSHELL_NAMESPACE
              value: openshell
            - name: STEWARD_SPIFFE_TRUST_DOMAIN
              value: openshell.local
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /.well-known/jwks.json
              port: http
          volumeMounts:
            - name: mint-secrets
              mountPath: /run/steward
              readOnly: true
            - name: spiffe-workload-api
              mountPath: /spiffe-workload-api
              readOnly: true
      volumes:
        - name: mint-secrets
          secret:
            secretName: steward-s2-secrets
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: steward-mint-tools
  namespace: steward-system
spec:
  selector:
    app: steward-s5-mint-tools
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: steward-opa
  namespace: steward-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steward-s5-opa
  template:
    metadata:
      labels:
        app: steward-s5-opa
    spec:
      containers:
        - name: opa
          image: openpolicyagent/opa:1.18.2-static@sha256:57f7d06808fff6de3ea1d698e6430990973ca1370be0e54975f0083d615521da
          args: ["run", "--server", "--addr=0.0.0.0:8181", "/policy/mcp_tools.rego"]
          ports:
            - name: http
              containerPort: 8181
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: policy
              mountPath: /policy/mcp_tools.rego
              subPath: mcp_tools.rego
              readOnly: true
      volumes:
        - name: policy
          configMap:
            name: steward-s5-policy
---
apiVersion: v1
kind: Service
metadata:
  name: steward-opa
  namespace: steward-system
spec:
  selector:
    app: steward-s5-opa
  ports:
    - name: http
      port: 8181
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-github-mcp
  namespace: steward-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steward-s5-fake-github-mcp
  template:
    metadata:
      labels:
        app: steward-s5-fake-github-mcp
    spec:
      containers:
        - name: server
          image: STEWARD_S5_MCP_GW_IMAGE
          imagePullPolicy: Never
          command: ["bun", "run", "/fixture/fake-github-mcp.ts"]
          ports:
            - name: http
              containerPort: 8082
          readinessProbe:
            tcpSocket:
              port: http
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: steward-s5-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: fake-github-mcp
  namespace: steward-system
spec:
  selector:
    app: steward-s5-fake-github-mcp
  ports:
    - name: http
      port: 8082
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mcp-gw
  namespace: steward-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steward-s5-mcp-gw
  template:
    metadata:
      labels:
        app: steward-s5-mcp-gw
    spec:
      containers:
        - name: mcp-gw
          image: STEWARD_S5_MCP_GW_IMAGE
          imagePullPolicy: Never
          env:
            - name: GITHUB_MCP_UPSTREAM_URL
              value: http://fake-github-mcp.steward-system.svc.cluster.local:8082/mcp
            - name: GITHUB_OAUTH_SCOPES
              value: repo
            - name: GITHUB_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: steward-s5-mcp-gw
                  key: encryption-key
            - name: HOP1_AUDIENCE
              value: steward-mcp
            - name: HOP1_EMAIL_CLAIM
              value: email
            - name: HOP1_INTROSPECTION_CLIENT_CREDENTIAL
              valueFrom:
                secretKeyRef:
                  name: steward-s5-mcp-gw
                  key: introspection-client
            - name: HOP1_INTROSPECTION_URL
              value: http://steward-mint-tools.steward-system.svc.cluster.local:8080/introspect
            - name: HOP1_ISSUER
              value: http://steward-mint-tools.steward-system.svc.cluster.local:8080
            - name: HOP1_JWKS_URL
              value: http://steward-mint-tools.steward-system.svc.cluster.local:8080/.well-known/jwks.json
            - name: HOP1_PROFILE
              value: steward
            - name: HOP1_SUBJECT_CLAIM
              value: sub
            - name: OPA_POLICY_URL
              value: http://steward-opa.steward-system.svc.cluster.local:8181/v1/data/steward/mcp/decision
            - name: PORT
              value: "8080"
            - name: TOKEN_STORE_DSN
              value: postgres://steward@postgres.steward-system.svc.cluster.local:5432/steward
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
---
apiVersion: v1
kind: Service
metadata:
  name: mcp-gw
  namespace: steward-system
spec:
  selector:
    app: steward-s5-mcp-gw
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hop1-capture
  namespace: steward-system
spec:
  replicas: 1
  selector:
    matchLabels:
      app: steward-s5-hop1-capture
  template:
    metadata:
      labels:
        app: steward-s5-hop1-capture
    spec:
      containers:
        - name: proxy
          image: STEWARD_S5_MCP_GW_IMAGE
          imagePullPolicy: Never
          command: ["bun", "run", "/fixture/capture-proxy.ts"]
          env:
            - name: INFERENCE_URL
              value: http://litellm.steward-system.svc.cluster.local:4000/v1/chat/completions
            - name: MCP_URL
              value: http://mcp-gw.steward-system.svc.cluster.local:8080/mcp
            - name: TOOLS_MINT_URL
              value: http://steward-mint-tools.steward-system.svc.cluster.local:8080/token
          ports:
            - name: http
              containerPort: 8085
          readinessProbe:
            httpGet:
              path: /health
              port: http
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: steward-s5-fixtures
---
apiVersion: v1
kind: Service
metadata:
  name: hop1-capture
  namespace: steward-system
spec:
  selector:
    app: steward-s5-hop1-capture
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: hop1-capture-tools
  namespace: steward-system
spec:
  selector:
    app: steward-s5-hop1-capture
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: v1
kind: Service
metadata:
  name: hop1-capture-inference
  namespace: steward-system
spec:
  selector:
    app: steward-s5-hop1-capture
  ports:
    - name: http
      port: 8085
      targetPort: http
---
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-mcp-gw
  namespace: steward-system
spec:
  backoffLimit: 6
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: seed
          image: STEWARD_S5_MCP_GW_IMAGE
          imagePullPolicy: Never
          command: ["bun", "run", "/fixture/seed-mcp-gw.ts"]
          env:
            - name: GITHUB_TOKEN_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: steward-s5-mcp-gw
                  key: encryption-key
            - name: HOP1_ISSUER
              value: http://steward-mint-tools.steward-system.svc.cluster.local:8080
            - name: TOKEN_STORE_DSN
              value: postgres://steward@postgres.steward-system.svc.cluster.local:5432/steward
          volumeMounts:
            - name: fixture
              mountPath: /fixture
              readOnly: true
      volumes:
        - name: fixture
          configMap:
            name: steward-s5-fixtures
