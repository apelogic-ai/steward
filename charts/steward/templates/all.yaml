{{- $stableBridgeBundleName := printf "steward-stable-bridge-attestation-%s" (.Values.stableBridge.attestationBundle | sha256sum | trunc 12) }}
{{- $connectionsBridgeBundleName := printf "steward-connections-bridge-attestation-%s" (.Values.connectionsBridge.attestationBundle | sha256sum | trunc 12) }}
{{- if and .Values.web.enabled .Values.web.ingress.enabled (ne .Values.browserAuth.google.origin (printf "https://%s" .Values.web.host)) }}
{{- fail "web.host must exactly match the HTTPS browserAuth.google.origin" }}
{{- end }}
{{- if and .Values.connectionsBridge.enabled (not (has .Values.connectionsBridge.runtimeNamespace .Values.runtimeNamespaces)) }}
{{- fail "connectionsBridge.runtimeNamespace must be one of runtimeNamespaces" }}
{{- end }}
{{- range $component := list "apiserver" "controller" "mint" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include (printf "steward.%sName" $component) $ }}
  labels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: {{ $component }} }
automountServiceAccountToken: true
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "steward.webName" . }}
  labels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: web }
automountServiceAccountToken: false
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: steward-apiserver }
rules:
  - apiGroups: ["agents.apelogic.ai"]
    resources: ["agentruntimes"]
    verbs: ["create", "delete", "get", "list", "patch", "update"]
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: steward-controller }
rules:
  - apiGroups: ["agents.apelogic.ai"]
    resources: ["agentruntimes", "agentruntimes/status", "agentruntimes/finalizers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]
  - apiGroups: [""]
    resources: ["users", "groups"]
    verbs: ["impersonate"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: steward-mint }
rules:
  - apiGroups: ["agents.apelogic.ai"]
    resources: ["agentruntimes"]
    verbs: ["get", "list"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list"]
{{- range $component := list "apiserver" "controller" "mint" }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: steward-{{ $component }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: steward-{{ $component }} }
subjects:
  - kind: ServiceAccount
    name: {{ include (printf "steward.%sName" $component) $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
{{- range $namespace := .Values.runtimeNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: steward-controller-runtime-secrets
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "delete", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: steward-controller-runtime-secrets
  namespace: {{ $namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: steward-controller-runtime-secrets }
subjects:
  - kind: ServiceAccount
    name: {{ include "steward.controllerName" $ }}
    namespace: {{ $.Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: steward-mint-runtime-secrets
  namespace: {{ $namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: steward-mint-runtime-secrets
  namespace: {{ $namespace }}
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: Role, name: steward-mint-runtime-secrets }
subjects:
  - kind: ServiceAccount
    name: {{ include "steward.mintName" $ }}
    namespace: {{ $.Release.Namespace }}
{{- end }}
---
apiVersion: spire.spiffe.io/v1alpha1
kind: ClusterSPIFFEID
metadata:
  name: steward-mint
spec:
  spiffeIDTemplate: spiffe://{{ .Values.config.mint.spiffeTrustDomain }}{{ .Values.spire.identityPath }}
  namespaceSelector:
    matchLabels:
      kubernetes.io/metadata.name: {{ .Release.Namespace }}
  podSelector:
    matchLabels:
      app.kubernetes.io/name: steward
      app.kubernetes.io/component: mint
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: steward-apiserver-tls }
spec:
  secretName: steward-apiserver-tls
  dnsNames:
    - steward-apiserver
    - steward-apiserver.{{ .Release.Namespace }}.svc
    - steward-apiserver.{{ .Release.Namespace }}.svc.{{ .Values.services.clusterDomain }}
  issuerRef:
{{ toYaml .Values.tls.issuerRef | nindent 4 }}
{{- if .Values.stableBridge.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ $stableBridgeBundleName }} }
immutable: true
data:
  bundle.jsonl: |-
{{ .Values.stableBridge.attestationBundle | indent 4 }}
{{- end }}
{{- if and .Values.connectionsBridge.enabled (eq .Values.connectionsBridge.artifactTrust.mode "github-attestation") }}
---
apiVersion: v1
kind: ConfigMap
metadata: { name: {{ $connectionsBridgeBundleName }} }
immutable: true
data:
  bundle.jsonl: |-
{{ .Values.connectionsBridge.attestationBundle | indent 4 }}
{{- end }}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata: { name: steward-webhook-tls }
spec:
  secretName: steward-webhook-tls
  dnsNames:
    - steward-webhook
    - steward-webhook.{{ .Release.Namespace }}.svc
    - steward-webhook.{{ .Release.Namespace }}.svc.{{ .Values.services.clusterDomain }}
  issuerRef:
{{ toYaml .Values.tls.issuerRef | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata: { name: steward-apiserver }
spec:
  selector: { app.kubernetes.io/name: steward, app.kubernetes.io/component: apiserver }
  ports: [{ name: https, port: {{ .Values.services.apiserverPort }}, targetPort: https }]
---
apiVersion: v1
kind: Service
metadata: { name: steward-webhook }
spec:
  selector: { app.kubernetes.io/name: steward, app.kubernetes.io/component: controller }
  ports: [{ name: https, port: {{ .Values.services.webhookPort }}, targetPort: webhook }]
---
apiVersion: v1
kind: Service
metadata: { name: steward-mint }
spec:
  selector: { app.kubernetes.io/name: steward, app.kubernetes.io/component: mint }
  ports: [{ name: http, port: {{ .Values.services.mintPort }}, targetPort: http }]
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: Service
metadata: { name: steward-web }
spec:
  selector: { app.kubernetes.io/name: steward, app.kubernetes.io/component: web }
  ports: [{ name: http, port: {{ .Values.services.webPort }}, targetPort: http }]
{{- end }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: steward-agentruntime
  annotations: { cert-manager.io/inject-ca-from: {{ printf "%s/steward-webhook-tls" .Release.Namespace | quote }} }
webhooks:
  - name: agentruntime.steward.agents.apelogic.ai
    admissionReviewVersions: ["v1"]
    sideEffects: None
    failurePolicy: Fail
    matchPolicy: Equivalent
    clientConfig:
      service: { name: steward-webhook, namespace: {{ .Release.Namespace }}, path: /validate-agent-runtime, port: {{ .Values.services.webhookPort }} }
    rules:
      - apiGroups: ["agents.apelogic.ai"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "DELETE", "UPDATE"]
        resources: ["agentruntimes"]
        scope: "*"
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "steward.apiserverName" . }} }
spec:
  replicas: {{ .Values.replicaCount.apiserver }}
  selector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: apiserver } }
  template:
    metadata: { labels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: apiserver } }
    spec:
      serviceAccountName: {{ include "steward.apiserverName" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: apiserver
          image: {{ include "steward.image" (dict "root" . "image" .Values.images.apiserver) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          ports: [{ name: https, containerPort: 8443 }]
          readinessProbe: { tcpSocket: { port: https }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: https }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: STEWARD_DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.database.name }}, key: {{ .Values.secrets.database.key }} } } }
            - { name: STEWARD_JIRA_TOKEN, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.jira.name }}, key: {{ .Values.secrets.jira.key }} } } }
            - { name: STEWARD_JIRA_BASE_URL, value: {{ .Values.config.apiserver.jiraBaseUrl | quote }} }
            - { name: STEWARD_JIRA_PROJECT_KEY, value: {{ .Values.config.apiserver.jiraProjectKey | quote }} }
            - { name: STEWARD_JIRA_ACCOUNT_EMAIL, value: {{ .Values.config.apiserver.jiraAccountEmail | quote }} }
            - { name: STEWARD_KUBERNETES_TOKEN_REVIEW_AUDIENCE, value: {{ .Values.config.apiserver.kubernetesTokenReviewAudience | quote }} }
            - { name: STEWARD_TASK_WORKFLOWS_JSON, value: {{ .Values.config.apiserver.taskWorkflowsJson | quote }} }
{{- if .Values.config.apiserver.taskExecutionBindingsJson }}
            - { name: STEWARD_TASK_EXECUTION_BINDINGS_JSON, value: {{ .Values.config.apiserver.taskExecutionBindingsJson | quote }} }
{{- end }}
            - { name: STEWARD_TASK_MCP_GW_ENDPOINT, value: {{ .Values.config.apiserver.mcpGatewayEndpoint | quote }} }
{{- if .Values.taskIdentity.enabled }}
            - { name: STEWARD_IDENTITY_TASK_ISSUER, value: {{ .Values.taskIdentity.issuer | quote }} }
            - { name: STEWARD_IDENTITY_TASK_AUDIENCE, value: {{ .Values.taskIdentity.audience | quote }} }
            - { name: STEWARD_IDENTITY_TASK_JWKS_FILE, value: /run/identity-task/jwks.json }
{{- end }}
{{- if .Values.browserAuth.enabled }}
            - { name: STEWARD_GOOGLE_OIDC_CLIENT_ID, value: {{ .Values.browserAuth.google.clientId | quote }} }
            - { name: STEWARD_BROWSER_ORIGIN, value: {{ .Values.browserAuth.google.origin | quote }} }
            - { name: STEWARD_GOOGLE_WORKSPACE_DOMAIN, value: {{ .Values.browserAuth.google.workspaceDomain | quote }} }
            - { name: STEWARD_ORGANIZATION_ID, value: {{ .Values.browserAuth.google.organizationId | quote }} }
            - { name: STEWARD_GOOGLE_OIDC_CLIENT_SECRET, valueFrom: { secretKeyRef: { name: {{ .Values.browserAuth.google.clientSecret.name }}, key: {{ .Values.browserAuth.google.clientSecret.key }} } } }
{{- end }}
{{- if .Values.connectionsBridge.enabled }}
            - { name: STEWARD_CONNECTIONS_BRIDGE_ARTIFACT_TRUST_MODE, value: {{ .Values.connectionsBridge.artifactTrust.mode | quote }} }
            - { name: STEWARD_CONNECTIONS_BRIDGE_IMAGE, value: {{ .Values.connectionsBridge.image | quote }} }
            - { name: STEWARD_CONNECTIONS_MCP_GW_ORIGIN, value: {{ .Values.connectionsBridge.mcpGatewayOrigin | quote }} }
            - { name: STEWARD_CONNECTIONS_MCP_GW_VERSION, value: {{ .Values.connectionsBridge.mcpGatewayVersion | quote }} }
            - { name: STEWARD_CONNECTIONS_RUNTIME_NAMESPACE, value: {{ .Values.connectionsBridge.runtimeNamespace | quote }} }
            - { name: STEWARD_OPENSHELL_RUNTIME_CLASS_NAME, value: {{ .Values.config.controller.openshellRuntimeClassName | quote }} }
{{- end }}
{{- if .Values.stableBridge.enabled }}
            - { name: STEWARD_STABLE_BRIDGE_IMAGE, value: {{ .Values.stableBridge.image | quote }} }
            - { name: STEWARD_STABLE_BRIDGE_SIGNER_IDENTITY, value: {{ .Values.stableBridge.signerIdentity | quote }} }
            - { name: STEWARD_STABLE_BRIDGE_SOURCE_REPOSITORY, value: {{ .Values.stableBridge.sourceRepository | quote }} }
            - { name: STEWARD_STABLE_BRIDGE_SOURCE_COMMIT, value: {{ .Values.stableBridge.sourceCommit | quote }} }
            - { name: STEWARD_STABLE_BRIDGE_ATTESTATION_BUNDLE_FILE, value: /run/stable-bridge-attestation/bundle.jsonl }
            - { name: STEWARD_STABLE_BRIDGE_SERVICE, value: {{ .Values.stableBridge.service | quote }} }
{{- end }}
            - { name: STEWARD_TLS_CERT_DER, value: /run/tls/tls.crt }
            - { name: STEWARD_TLS_KEY_DER, value: /run/tls/tls.key }
          volumeMounts:
            - { name: tls, mountPath: /run/tls, readOnly: true }
{{- if .Values.taskIdentity.enabled }}
            - { name: identity-task, mountPath: /run/identity-task, readOnly: true }
{{- end }}
{{- if .Values.stableBridge.enabled }}
            - { name: stable-bridge-attestation, mountPath: /run/stable-bridge-attestation, readOnly: true }
{{- end }}
          resources:
{{ toYaml .Values.resources.apiserver | nindent 12 }}
      volumes:
        - { name: tls, secret: { secretName: steward-apiserver-tls } }
{{- if .Values.taskIdentity.enabled }}
        - name: identity-task
          configMap:
            name: {{ .Values.taskIdentity.publicJwksConfigMap.name }}
            items: [{ key: {{ .Values.taskIdentity.publicJwksConfigMap.key }}, path: jwks.json }]
{{- end }}
{{- if .Values.stableBridge.enabled }}
        - name: stable-bridge-attestation
          configMap:
            name: {{ $stableBridgeBundleName }}
            items: [{ key: bundle.jsonl, path: bundle.jsonl }]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "steward.controllerName" . }} }
spec:
  replicas: {{ .Values.replicaCount.controller }}
  selector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: controller } }
  template:
    metadata: { labels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: controller } }
    spec:
      serviceAccountName: {{ include "steward.controllerName" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: controller
          image: {{ include "steward.image" (dict "root" . "image" .Values.images.controller) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          ports: [{ name: webhook, containerPort: 8443 }]
          readinessProbe: { tcpSocket: { port: webhook }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: webhook }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: STEWARD_DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.database.name }}, key: {{ .Values.secrets.database.key }} } } }
            - { name: STEWARD_LITELLM_MASTER_KEY, valueFrom: { secretKeyRef: { name: {{ .Values.secrets.litellm.name }}, key: {{ .Values.secrets.litellm.key }} } } }
            - { name: STEWARD_LITELLM_URL, value: {{ .Values.config.controller.litellmUrl | quote }} }
            - { name: STEWARD_OPENSHELL_ENDPOINT, value: {{ .Values.config.controller.openshellEndpoint | quote }} }
            - { name: STEWARD_OPENSHELL_SERVER_NAME, value: {{ .Values.config.controller.openshellServerName | quote }} }
            - { name: STEWARD_OPENSHELL_RUNTIME_CLASS_NAME, value: {{ .Values.config.controller.openshellRuntimeClassName | quote }} }
            - { name: STEWARD_OPENSHELL_TASK_LOG_MODE, value: {{ .Values.config.controller.openshellTaskLogMode | quote }} }
            - { name: STEWARD_OPENSHELL_CA_CERTIFICATE_FILE, value: /run/openshell/ca.crt }
            - { name: STEWARD_OPENSHELL_CLIENT_CERTIFICATE_FILE, value: /run/openshell/tls.crt }
            - { name: STEWARD_OPENSHELL_CLIENT_PRIVATE_KEY_FILE, value: /run/openshell/tls.key }
            - { name: STEWARD_WORKLOAD_EXCHANGE_ENDPOINT, value: {{ .Values.config.controller.workloadExchangeEndpoint | quote }} }
            - { name: STEWARD_WORKLOAD_EXCHANGE_SERVER_NAME, value: {{ .Values.config.controller.workloadExchangeServerName | quote }} }
            - { name: STEWARD_WORKLOAD_EXCHANGE_CA_CERTIFICATE_FILE, value: /run/workload-exchange/ca.crt }
            - { name: STEWARD_WORKLOAD_SOURCE_CREDENTIAL_FILE, value: /var/run/secrets/steward/workload/source-token }
            - { name: STEWARD_CONTROLLER_USERNAME, value: {{ printf "system:serviceaccount:%s:steward-controller" .Release.Namespace | quote }} }
            - { name: STEWARD_APISERVER_USERNAME, value: {{ printf "system:serviceaccount:%s:steward-apiserver" .Release.Namespace | quote }} }
{{- if .Values.connectionsBridge.enabled }}
            - { name: STEWARD_CONNECTIONS_BRIDGE_ARTIFACT_TRUST_MODE, value: {{ .Values.connectionsBridge.artifactTrust.mode | quote }} }
            - { name: STEWARD_CONNECTIONS_BRIDGE_IMAGE, value: {{ .Values.connectionsBridge.image | quote }} }
{{- if eq .Values.connectionsBridge.artifactTrust.mode "github-attestation" }}
            - { name: STEWARD_CONNECTIONS_BRIDGE_SIGNER_IDENTITY, value: {{ .Values.connectionsBridge.signerIdentity | quote }} }
            - { name: STEWARD_CONNECTIONS_BRIDGE_SOURCE_REPOSITORY, value: {{ .Values.connectionsBridge.sourceRepository | quote }} }
            - { name: STEWARD_CONNECTIONS_BRIDGE_SOURCE_COMMIT, value: {{ .Values.connectionsBridge.sourceCommit | quote }} }
            - { name: STEWARD_CONNECTIONS_BRIDGE_ATTESTATION_BUNDLE_FILE, value: /run/connections-bridge-attestation/bundle.jsonl }
{{- end }}
            - { name: STEWARD_CONNECTIONS_MCP_GW_ORIGIN, value: {{ .Values.connectionsBridge.mcpGatewayOrigin | quote }} }
            - { name: STEWARD_CONNECTIONS_MCP_GW_VERSION, value: {{ .Values.connectionsBridge.mcpGatewayVersion | quote }} }
            - { name: STEWARD_CONNECTIONS_RUNTIME_NAMESPACE, value: {{ .Values.connectionsBridge.runtimeNamespace | quote }} }
{{- end }}
            - { name: STEWARD_TLS_CERT_DER, value: /run/tls/tls.crt }
            - { name: STEWARD_TLS_KEY_DER, value: /run/tls/tls.key }
          volumeMounts:
            - { name: tls, mountPath: /run/tls, readOnly: true }
            - { name: openshell-client, mountPath: /run/openshell, readOnly: true }
            - { name: workload-exchange-ca, mountPath: /run/workload-exchange, readOnly: true }
            - { name: workload-source-credential, mountPath: /var/run/secrets/steward/workload, readOnly: true }
{{- if and .Values.connectionsBridge.enabled (eq .Values.connectionsBridge.artifactTrust.mode "github-attestation") }}
            - { name: connections-bridge-attestation, mountPath: /run/connections-bridge-attestation, readOnly: true }
{{- end }}
          resources:
{{ toYaml .Values.resources.controller | nindent 12 }}
      volumes:
        - { name: tls, secret: { secretName: steward-webhook-tls } }
        - name: openshell-client
          secret:
            secretName: {{ .Values.secrets.openshellClient.name }}
            items:
              - { key: {{ .Values.secrets.openshellClient.caCertificate }}, path: ca.crt }
              - { key: {{ .Values.secrets.openshellClient.clientCertificate }}, path: tls.crt }
              - { key: {{ .Values.secrets.openshellClient.clientPrivateKey }}, path: tls.key }
        - name: workload-exchange-ca
{{- if eq .Values.workloadExchangeTrust.kind "Secret" }}
          secret:
            secretName: {{ .Values.workloadExchangeTrust.name }}
{{- else }}
          configMap:
            name: {{ .Values.workloadExchangeTrust.name }}
{{- end }}
            items:
              - { key: {{ .Values.workloadExchangeTrust.caCertificate }}, path: ca.crt }
        - name: workload-source-credential
          projected:
            sources:
              - serviceAccountToken:
                  audience: apelogic-workload-exchange
                  expirationSeconds: 600
                  path: source-token
{{- if and .Values.connectionsBridge.enabled (eq .Values.connectionsBridge.artifactTrust.mode "github-attestation") }}
        - name: connections-bridge-attestation
          configMap:
            name: {{ $connectionsBridgeBundleName }}
            items: [{ key: bundle.jsonl, path: bundle.jsonl }]
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: {{ include "steward.mintName" . }} }
spec:
  replicas: {{ .Values.replicaCount.mint }}
  selector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: mint } }
  template:
    metadata: { labels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: mint } }
    spec:
      serviceAccountName: {{ include "steward.mintName" . }}
      securityContext: { runAsNonRoot: true, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: mint
          image: {{ include "steward.image" (dict "root" . "image" .Values.images.mint) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          ports: [{ name: http, containerPort: 8080 }]
          readinessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { tcpSocket: { port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: SPIFFE_ENDPOINT_SOCKET, value: {{ printf "unix://%s/spire-agent.sock" .Values.spire.socketPath | quote }} }
            - { name: STEWARD_MINT_SIGNING_KEY_FILE, value: /run/mint/signing-key }
            - { name: STEWARD_MINT_INTROSPECTION_CLIENT_CREDENTIAL_FILE, value: /run/mint/introspection-credential }
            - { name: STEWARD_MINT_ISSUER, value: {{ .Values.config.mint.issuer | quote }} }
            - { name: STEWARD_MINT_AUDIENCE, value: {{ .Values.config.mint.audience | quote }} }
            - { name: STEWARD_MINT_ALLOWED_SCOPES, value: {{ .Values.config.mint.allowedScopes | quote }} }
            - { name: STEWARD_MINT_SVID_AUDIENCE, value: {{ .Values.config.mint.svidAudience | quote }} }
            - { name: STEWARD_SPIFFE_TRUST_DOMAIN, value: {{ .Values.config.mint.spiffeTrustDomain | quote }} }
            - { name: STEWARD_OPENSHELL_NAMESPACE, value: {{ .Values.config.mint.openshellNamespace | quote }} }
          volumeMounts:
            - { name: mint-secret, mountPath: /run/mint, readOnly: true }
            - { name: spiffe-workload-api, mountPath: {{ .Values.spire.socketPath }}, readOnly: true }
          resources:
{{ toYaml .Values.resources.mint | nindent 12 }}
      volumes:
        - name: mint-secret
          secret:
            secretName: {{ .Values.secrets.mint.name }}
            items:
              - { key: {{ .Values.secrets.mint.signingKey }}, path: signing-key }
              - { key: {{ .Values.secrets.mint.introspectionCredential }}, path: introspection-credential }
        - name: spiffe-workload-api
          csi: { driver: {{ .Values.spire.csiDriver }}, readOnly: true }
{{- if .Values.web.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: steward-web }
spec:
  replicas: {{ .Values.replicaCount.web }}
  selector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: web } }
    spec:
      serviceAccountName: {{ include "steward.webName" . }}
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: web
          image: {{ include "steward.image" (dict "root" . "image" .Values.images.web) }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
          ports: [{ name: http, containerPort: 3000 }]
          readinessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 2, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /health/ready, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          env:
            - { name: HOSTNAME, value: 0.0.0.0 }
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "3000" }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
          resources:
{{ toYaml .Values.resources.web | nindent 12 }}
      volumes:
        - { name: tmp, emptyDir: {} }
{{- if .Values.web.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steward-api
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.web.ingress.className }}
  tls:
    - hosts: [{{ .Values.web.host | quote }}]
      secretName: {{ .Values.web.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.web.host | quote }}
      http:
        paths:
          - { path: /admin/api, pathType: Prefix, backend: { service: { name: steward-apiserver, port: { name: https } } } }
          - { path: /admin/auth, pathType: Prefix, backend: { service: { name: steward-apiserver, port: { name: https } } } }
          - { path: /admin/connections/github/callback, pathType: Exact, backend: { service: { name: steward-apiserver, port: { name: https } } } }
          - { path: /app/api, pathType: Prefix, backend: { service: { name: steward-apiserver, port: { name: https } } } }
          - { path: /v1, pathType: Prefix, backend: { service: { name: steward-apiserver, port: { name: https } } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steward-web
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: {{ .Values.web.ingress.className }}
  tls:
    - hosts: [{{ .Values.web.host | quote }}]
      secretName: {{ .Values.web.ingress.tlsSecretName }}
  rules:
    - host: {{ .Values.web.host | quote }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: steward-web, port: { name: http } } } }
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-default-deny }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward } }
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-dns-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.dnsNamespace }} } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-apiserver-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: apiserver } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.burbleNamespace }} } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.arcNamespace }} } }
      ports: [{ protocol: TCP, port: 8443 }]
{{- if .Values.web.enabled }}
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} } }
      ports: [{ protocol: TCP, port: 8443 }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-webhook-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: controller } }
  policyTypes: [Ingress]
{{- if .Values.networkPolicy.kubeApiCidrs }}
  ingress:
    - from:
{{- range .Values.networkPolicy.kubeApiCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: 8443 }]
{{- else }}
  ingress: []
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-mint-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: mint } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.openshellNamespace }} } }
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.mcpGatewayNamespace }} } }
      ports: [{ protocol: TCP, port: 8080 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-controller-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: controller } }
  policyTypes: [Egress]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.litellmNamespace }} } } }]
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.litellm }} }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.openshellNamespace }} } } }]
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.openshell }} }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.identityExchangeNamespace }} } } }]
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.identityExchange }} }]
{{- if .Values.networkPolicy.postgresCidrs }}
    - to:
{{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.postgres }} }]
{{- end }}
{{- if .Values.networkPolicy.kubeApiCidrs }}
    - to:
{{- range .Values.networkPolicy.kubeApiCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.kubernetesApi }} }]
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-apiserver-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: apiserver } }
  policyTypes: [Egress]
{{- if or .Values.networkPolicy.postgresCidrs .Values.networkPolicy.jiraCidrs .Values.networkPolicy.kubeApiCidrs (and .Values.browserAuth.enabled .Values.networkPolicy.browserAuthEgressCidrs) }}
  egress:
{{- if .Values.networkPolicy.postgresCidrs }}
    - to:
{{- range .Values.networkPolicy.postgresCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.postgres }} }]
{{- end }}
{{- if .Values.networkPolicy.jiraCidrs }}
    - to:
{{- range .Values.networkPolicy.jiraCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.jira }} }]
{{- end }}
{{- if and .Values.browserAuth.enabled .Values.networkPolicy.browserAuthEgressCidrs }}
    - to:
{{- range .Values.networkPolicy.browserAuthEgressCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: 443 }]
{{- end }}
{{- if .Values.networkPolicy.kubeApiCidrs }}
    - to:
{{- range .Values.networkPolicy.kubeApiCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.kubernetesApi }} }]
{{- end }}
{{- else }}
  egress: []
{{- end }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-mint-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: mint } }
  policyTypes: [Egress]
{{- if .Values.networkPolicy.kubeApiCidrs }}
  egress:
    - to:
{{- range .Values.networkPolicy.kubeApiCidrs }}
        - ipBlock: { cidr: {{ . }} }
{{- end }}
      ports: [{ protocol: TCP, port: {{ .Values.networkPolicy.ports.kubernetesApi }} }]
{{- else }}
  egress: []
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-web-ingress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: web } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: {{ .Values.networkPolicy.ingressNamespace }} } }
      ports: [{ protocol: TCP, port: 3000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: steward-web-egress }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: steward, app.kubernetes.io/component: web } }
  policyTypes: [Egress]
  egress: []
{{- end }}
{{- end }}
