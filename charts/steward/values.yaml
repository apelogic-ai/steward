images:
  # No distribution is assumed. Supply a fork-owned repository and exact
  # immutable component coordinates from one verified release handoff.
  repository: ""
  pullPolicy: IfNotPresent
  apiserver:
    tag: ""
    digest: ""
  controller:
    tag: ""
    digest: ""
  mint:
    tag: ""
    digest: ""
  web:
    tag: ""
    digest: ""
imagePullSecrets: []
execution:
  # Core API/webhook mode. Governed execution requires an explicit switch
  # after OpenShell, identity, inference, and RuntimeClass preflight.
  enabled: false
serviceAccounts:
  # The chart creates these fixed service accounts. Annotations support
  # platform workload identity (for example, EKS IRSA) without exposing any
  # credentials in values.
  apiserver:
    annotations: {}
  controller:
    annotations: {}
  mint:
    annotations: {}
  web:
    annotations: {}
podAnnotations:
  apiserver: {}
  controller: {}
  mint: {}
  web: {}
web:
  enabled: false
  host: ""
  ingress:
    # Legacy standard Ingress support is opt-in.
    enabled: false
    className: ""
    tlsSecretName: ""
    apiAnnotations: {}
    webAnnotations: {}
  httpRoute:
    # Gateway API routing is opt-in and carries no parent, hostname, or paths
    # until the platform explicitly supplies them.
    enabled: false
    parentRefs: []
    hostname: ""
    apiPaths: []
    webPaths: []
secrets:
  database:
    name: steward-database
    key: url
  jira:
    name: steward-jira
    key: token
  litellm:
    name: steward-litellm
    key: master-key
  openshellClient:
    name: steward-openshell-client
    caCertificate: ca.crt
    clientCertificate: tls.crt
    clientPrivateKey: tls.key
  mint:
    name: steward-mint
    signingKey: signing-key
    introspectionCredential: introspection-credential
jira:
  enabled: false
browserAuth:
  enabled: false
  google:
    clientId: ""
    origin: ""
    workspaceDomain: ""
    organizationId: ""
    clientSecret:
      name: ""
      key: ""
workloadExchangeTrust:
  kind: ConfigMap
  name: steward-workload-exchange-ca
  caCertificate: ca.crt
taskIdentity:
  # Default deployments authenticate task submissions with Kubernetes TokenReview.
  # Enable this only when an external Identity service issues the exact steward-task-v2
  # credential and its public JWKS is projected read-only into the apiserver.
  enabled: false
  issuer: ""
  audience: ""
  publicJwksConfigMap:
    name: ""
    key: ""
githubSource:
  # Enables exact Git object retrieval for direct Task packages through a read-only GitHub App.
  enabled: false
  appId: ""
  privateKeySecret:
    name: ""
    key: ""
  bindings:
    contractVersion: steward.source-repository-bindings/v1
    bindings: []
tls:
  # customerSecret consumes operator-issued TLS Secrets and a public webhook CA.
  # certManager creates both Certificates with the explicitly selected issuer.
  mode: customerSecret
  api:
    secretName: steward-apiserver-tls
  issuerRef:
    name: ""
    kind: Issuer
  webhook:
    secretName: steward-webhook-tls
    caBundlePem: ""
config:
  # First deploy the new binaries with staged ownership. Switch to active only after every
  # legacy controller replica is gone; the same value gates Task intent writers and owner loops.
  taskOrchestrationMode: staged
  apiserver:
    jiraBaseUrl: ""
    jiraProjectKey: ""
    jiraAccountEmail: ""
    kubernetesTokenReviewAudience: https://kubernetes.default.svc
    taskWorkflowsJson: "[]"
    # Keep staged for the first binary rollout; activate only after every controller is upgraded.
    executionBindingsMode: staged
    # Deployment-owned catalog. An empty list advertises no coding agents and creates no fallback.
    executionBindings:
      apiVersion: steward.execution-bindings/v1
      bindings: []
    # Exact OpenAI-compatible Responses API endpoint rendered by the Codex adapter.
    inferenceEndpoint: ""
    # Exact Anthropic-compatible API base URL rendered by the Claude Code adapter.
    anthropicInferenceEndpoint: ""
    # Exact streamable HTTP endpoint rendered only into tool-bearing Task plans.
    # Empty keeps tool-less tasks available and makes tool-bearing submission fail closed.
    mcpGatewayEndpoint: ""
  controller:
    openshellEndpoint: ""
    openshellServerName: ""
    openshellRuntimeClassName: ""
    openshellTaskLogMode: "off"
    workloadExchangeEndpoint: ""
    workloadExchangeServerName: ""
    litellmUrl: ""
  mint:
    issuer: ""
    audience: steward-mcp
    allowedScopes: mcp inference
    controlPlaneAudience: steward-mint-control-plane
    svidAudience: steward-mint
    spiffeTrustDomain: ""
    openshellNamespace: ""
stableBridge:
  # Disabled until GitOps supplies an immutable, provenance-verified bridge image and bundle.
  enabled: false
  image: ""
  signerIdentity: ""
  sourceRepository: ""
  sourceCommit: ""
  service: ""
  # A public GitHub artifact-attestation bundle; it is mounted read-only, not stored as a Secret.
  attestationBundle: ""
connectionsBridge:
  # Disabled unless the governed Connections surface and its immutable bridge artifact are
  # configured together. This identity and lifecycle are separate from stable agent runtimes.
  enabled: false
  artifactTrust:
    # Released artifacts use GitHub attestations by default. Operators must explicitly select
    # operator-pinned when their deployment system owns provenance verification.
    mode: github-attestation
  image: ""
  signerIdentity: ""
  sourceRepository: ""
  sourceCommit: ""
  mcpGatewayOrigin: ""
  # Authority v1 uses MCP-GW 0.3.2; authority v2 uses MCP-GW 0.4.9.
  mcpGatewayVersion: ""
  runtimeNamespace: ""
  attestationBundle: ""
runtimeNamespaces: []
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  kubeApiCidrs: []
  postgresCidrs: []
  jiraCidrs: []
  browserAuthEgressCidrs: []
  githubApiCidrs: []
  # The namespace of an explicitly configured edge implementation (for
  # example, Envoy Gateway). Empty denies edge-to-apiserver traffic.
  ingressNamespace: ""
  # No workload namespace may call the apiserver by default. Add each caller
  # namespace explicitly in the distribution's values file.
  apiserverIngressNamespaces: []
  # Deprecated compatibility inputs for pre-0.1.17 governed values. New
  # installations must use apiserverIngressNamespaces instead.
  burbleNamespace: ""
  arcNamespace: ""
  mcpGatewayNamespace: mcp-gw
  openshellNamespace: openshell
  identityExchangeNamespace: identity-exchange
  litellmNamespace: litellm
  ports:
    kubernetesApi: 443
    postgres: 5432
    jira: 443
    litellm: 4000
    openshell: 8080
    identityExchange: 8443
    mcpGateway: 8080
spire:
  csiDriver: csi.spiffe.io
  socketPath: /run/spire/sockets
  identityPath: /steward/mint
services:
  clusterDomain: cluster.local
  apiserverPort: 443
  webhookPort: 443
  mintPort: 8080
  webPort: 3000
replicaCount:
  apiserver: 1
  controller: 1
  mint: 1
  web: 1
resources:
  apiserver:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  controller:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: "1", memory: 512Mi }
  mint:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  web:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
probes:
  apiserver:
    readiness: { initialDelaySeconds: 2, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    liveness: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  controller:
    readiness: { initialDelaySeconds: 2, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    liveness: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  mint:
    readiness: { initialDelaySeconds: 2, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    liveness: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
  web:
    readiness: { initialDelaySeconds: 2, periodSeconds: 5, timeoutSeconds: 3, failureThreshold: 3 }
    liveness: { initialDelaySeconds: 10, periodSeconds: 10, timeoutSeconds: 3, failureThreshold: 3 }
persistence:
  # Steward persists authority and Task state in the external Postgres URL
  # referenced by secrets.database. This chart intentionally owns no PVC.
  enabled: false
