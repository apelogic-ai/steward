images:
  repository: ghcr.io/apelogic-ai/steward
  pullPolicy: IfNotPresent
  apiserver:
    tag: ""
    digest: ""
  controller:
    tag: ""
    digest: ""
  mint:
    tag: ""
    digest: ""
  web:
    tag: ""
    digest: ""
web:
  enabled: false
  host: ""
  ingress:
    className: ""
    tlsSecretName: ""
secrets:
  database:
    name: steward-database
    key: url
  jira:
    name: steward-jira
    key: token
  litellm:
    name: steward-litellm
    key: master-key
  openshellClient:
    name: steward-openshell-client
    caCertificate: ca.crt
    clientCertificate: tls.crt
    clientPrivateKey: tls.key
  mint:
    name: steward-mint
    signingKey: signing-key
    introspectionCredential: introspection-credential
browserAuth:
  enabled: false
  google:
    clientId: ""
    origin: ""
    workspaceDomain: ""
    organizationId: ""
    clientSecret:
      name: ""
      key: ""
browserHop1:
  # Disabled unless browser authentication, a private Identity exchange endpoint,
  # and every signer/projection input are supplied together.
  enabled: false
  mcpGatewayOrigin: ""
  identityEndpoint: ""
  issuer: ""
  assertionAudience: ""
  keyId: ""
  signingKeySecret:
    name: ""
    key: ""
  publicJwksConfigMap:
    name: ""
    key: ""
  serviceAccountTokenAudience: ""
  # A local-only TCP bridge may expose an in-cluster HTTP provider endpoint
  # to the browser-session broker's explicit 127.0.0.1 origin. It is disabled
  # by default and every enabled input is immutable and explicit.
  loopbackProxy:
    enabled: false
    image: ""
    targetHost: ""
    targetPort: 0
workloadExchangeTrust:
  name: steward-workload-exchange-ca
  caCertificate: ca.crt
taskIdentity:
  # Default deployments authenticate task submissions with Kubernetes TokenReview.
  # Enable this only when an external Identity service issues the exact steward-task-v2
  # credential and its public JWKS is projected read-only into the apiserver.
  enabled: false
  issuer: ""
  audience: ""
  publicJwksConfigMap:
    name: ""
    key: ""
tls:
  issuerRef:
    name: cluster-issuer
    kind: ClusterIssuer
config:
  apiserver:
    jiraBaseUrl: https://jira.example.com
    jiraProjectKey: PROJ
    jiraAccountEmail: alice@example.com
    kubernetesTokenReviewAudience: https://kubernetes.default.svc
    taskWorkflowsJson: "[]"
  controller:
    openshellEndpoint: https://gateway.example.test:8080
    openshellServerName: gateway.example.test
    openshellRuntimeClassName: kata-qemu
    workloadExchangeEndpoint: https://identity.example.test/v1/workload/exchange
    workloadExchangeServerName: identity.example.test
    litellmUrl: http://litellm-litellm.litellm.svc.cluster.local:4000
  mint:
    issuer: http://steward-mint.steward.svc.cluster.local:8080
    audience: steward-mcp
    allowedScopes: mcp inference
    svidAudience: steward-mint
    spiffeTrustDomain: example.test
    openshellNamespace: openshell
stableBridge:
  # Disabled until GitOps supplies an immutable, provenance-verified bridge image and bundle.
  enabled: false
  image: ""
  signerIdentity: ""
  sourceRepository: ""
  sourceCommit: ""
  service: ""
  # Exact MCP-GW origin injected only into the one-shot bridge runtime by the controller.
  mcpGatewayOrigin: ""
  # A public GitHub artifact-attestation bundle; it is mounted read-only, not stored as a Secret.
  attestationBundle: ""
runtimeNamespaces: []
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  kubeApiCidrs: []
  postgresCidrs: []
  jiraCidrs: []
  browserAuthEgressCidrs: []
  ingressNamespace: ingress-nginx
  burbleNamespace: burble
  arcNamespace: arc-runners
  mcpGatewayNamespace: mcp-gw
  openshellNamespace: openshell
  identityExchangeNamespace: identity-exchange
  litellmNamespace: litellm
  ports:
    kubernetesApi: 443
    postgres: 5432
    jira: 443
    litellm: 4000
    openshell: 8080
    identityExchange: 8443
    mcpGateway: 8080
spire:
  csiDriver: csi.spiffe.io
  socketPath: /run/spire/sockets
  identityPath: /steward/mint
services:
  clusterDomain: cluster.local
  apiserverPort: 443
  webhookPort: 443
  mintPort: 8080
  webPort: 3000
replicaCount:
  apiserver: 1
  controller: 1
  mint: 1
  web: 1
resources:
  apiserver: {}
  controller: {}
  mint: {}
  web: {}
