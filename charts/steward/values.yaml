images:
  repository: ghcr.io/apelogic-ai/steward
  pullPolicy: IfNotPresent
  apiserver:
    tag: ""
    digest: ""
  controller:
    tag: ""
    digest: ""
  mint:
    tag: ""
    digest: ""
  web:
    tag: ""
    digest: ""
web:
  enabled: false
  host: ""
  ingress:
    enabled: true
    className: ""
    tlsSecretName: ""
secrets:
  database:
    name: steward-database
    key: url
  jira:
    name: steward-jira
    key: token
  litellm:
    name: steward-litellm
    key: master-key
  openshellClient:
    name: steward-openshell-client
    caCertificate: ca.crt
    clientCertificate: tls.crt
    clientPrivateKey: tls.key
  mint:
    name: steward-mint
    signingKey: signing-key
    introspectionCredential: introspection-credential
browserAuth:
  enabled: false
  google:
    clientId: ""
    origin: ""
    workspaceDomain: ""
    organizationId: ""
    clientSecret:
      name: ""
      key: ""
workloadExchangeTrust:
  kind: ConfigMap
  name: steward-workload-exchange-ca
  caCertificate: ca.crt
taskIdentity:
  # Default deployments authenticate task submissions with Kubernetes TokenReview.
  # Enable this only when an external Identity service issues the exact steward-task-v2
  # credential and its public JWKS is projected read-only into the apiserver.
  enabled: false
  issuer: ""
  audience: ""
  publicJwksConfigMap:
    name: ""
    key: ""
tls:
  issuerRef:
    name: cluster-issuer
    kind: ClusterIssuer
config:
  apiserver:
    jiraBaseUrl: https://jira.example.com
    jiraProjectKey: PROJ
    jiraAccountEmail: alice@example.com
    kubernetesTokenReviewAudience: https://kubernetes.default.svc
    taskWorkflowsJson: "[]"
    # Optional deployment-owned catalog of exact logical agent execution bindings.
    # Empty preserves legacy/default-image behavior for existing Workflow revisions.
    taskExecutionBindingsJson: ""
    # Exact streamable HTTP endpoint rendered only into tool-bearing Codex task plans.
    # Empty keeps tool-less tasks available and makes tool-bearing submission fail closed.
    mcpGatewayEndpoint: ""
  controller:
    openshellEndpoint: https://gateway.example.test:8080
    openshellServerName: gateway.example.test
    openshellRuntimeClassName: kata-qemu
    openshellTaskLogMode: "off"
    workloadExchangeEndpoint: https://identity.example.test/v1/workload/exchange
    workloadExchangeServerName: identity.example.test
    litellmUrl: http://litellm-litellm.litellm.svc.cluster.local:4000
  mint:
    issuer: http://steward-mint.steward.svc.cluster.local:8080
    audience: steward-mcp
    allowedScopes: mcp inference
    svidAudience: steward-mint
    spiffeTrustDomain: example.test
    openshellNamespace: openshell
stableBridge:
  # Disabled until GitOps supplies an immutable, provenance-verified bridge image and bundle.
  enabled: false
  image: ""
  signerIdentity: ""
  sourceRepository: ""
  sourceCommit: ""
  service: ""
  # A public GitHub artifact-attestation bundle; it is mounted read-only, not stored as a Secret.
  attestationBundle: ""
connectionsBridge:
  # Disabled unless the governed Connections surface and its immutable bridge artifact are
  # configured together. This identity and lifecycle are separate from stable agent runtimes.
  enabled: false
  artifactTrust:
    # Released artifacts use GitHub attestations by default. Operators must explicitly select
    # operator-pinned when their deployment system owns provenance verification.
    mode: github-attestation
  image: ""
  signerIdentity: ""
  sourceRepository: ""
  sourceCommit: ""
  mcpGatewayOrigin: ""
  # Authority v1 is valid only for the exact MCP-GW OAuth contract in release 0.3.2.
  mcpGatewayVersion: ""
  runtimeNamespace: ""
  attestationBundle: ""
runtimeNamespaces: []
networkPolicy:
  enabled: true
  dnsNamespace: kube-system
  kubeApiCidrs: []
  postgresCidrs: []
  jiraCidrs: []
  browserAuthEgressCidrs: []
  ingressNamespace: ingress-nginx
  burbleNamespace: burble
  arcNamespace: arc-runners
  mcpGatewayNamespace: mcp-gw
  openshellNamespace: openshell
  identityExchangeNamespace: identity-exchange
  litellmNamespace: litellm
  ports:
    kubernetesApi: 443
    postgres: 5432
    jira: 443
    litellm: 4000
    openshell: 8080
    identityExchange: 8443
    mcpGateway: 8080
spire:
  csiDriver: csi.spiffe.io
  socketPath: /run/spire/sockets
  identityPath: /steward/mint
services:
  clusterDomain: cluster.local
  apiserverPort: 443
  webhookPort: 443
  mintPort: 8080
  webPort: 3000
replicaCount:
  apiserver: 1
  controller: 1
  mint: 1
  web: 1
resources:
  apiserver: {}
  controller: {}
  mint: {}
  web: {}
