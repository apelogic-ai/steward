[package]
name = "steward-apiserver-bin"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[features]
local-fixtures = ["steward-store/local-fixtures"]

[dependencies]
axum.workspace = true # Serves the authenticated REST admission and escalation API.
kube = { workspace = true, features = ["client", "ring", "rustls-tls"] } # Authenticates bearer tokens through Kubernetes TokenReview and writes AgentRuntime desired state.
steward-adapter-jira = { path = "../../adapters/jira", version = "=0.0.0" } # Delivers escalation decisions without leaking Jira types into core.
steward-adapter-github-artifact = { path = "../../adapters/github-artifact", version = "=0.0.0" } # Verifies the same digest-pinned bridge artifact used by controller provisioning.
steward-apiserver = { path = "../../crates/steward-apiserver", version = "=0.0.0" } # Provides the single authenticated REST admission router.
steward-store = { path = "../../crates/steward-store", version = "=0.0.0" } # Persists immutable envelopes, decisions, approvals, and instance grants.
steward-types = { path = "../../crates/steward-types", version = "=0.0.0" } # Parses opaque canonical user IDs for the explicit local-RBAC bootstrap command.
tokio.workspace = true # Runs the HTTPS listener and Kubernetes/Postgres/Jira I/O.
tokio-rustls.workspace = true # Terminates TLS for bearer-authenticated production endpoints.

[lints]
workspace = true
