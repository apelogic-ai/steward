[package]
name = "steward-adapter-litellm"
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
reqwest.workspace = true # Calls the LiteLLM management API over rustls-backed HTTP.
serde.workspace = true # Decodes the pinned LiteLLM management response contracts.
serde_json.workspace = true # Builds vendor wire payloads inside the adapter boundary.
sha2.workspace = true # Derives a stable, non-secret runtime key alias.
steward-ports = { path = "../../crates/steward-ports", version = "=0.0.0" }
steward-types = { path = "../../crates/steward-types", version = "=0.0.0" }

[dev-dependencies]
tokio.workspace = true # Executes asynchronous adapter contract tests without external services.

[lints]
workspace = true
