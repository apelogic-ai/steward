name: ci

on:
  pull_request:
  # Merge queue groups run the same gates as pull requests. The group is
  # checked out at github.sha on a gh-readonly-queue/main/... branch.
  merge_group:
    types:
      - checks_requested
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Classifies the change set as `full`, `web`, or `docs` so that web-only and
  # documentation-only changes run a reduced set of lanes. The rules and their
  # tests live in scripts/ci-change-class.sh; anything that is not provably
  # web-only or documentation-only, and every push, schedule, and manual run,
  # is `full`. Every lane below is gated on this class, and the `pinned`
  # aggregate checks each lane's result against it.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      class: ${{ steps.classify.outputs.class }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Classify the change set
        id: classify
        shell: bash
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
          CI_BASE_REF: ${{ github.event.pull_request.base.ref || github.event.merge_group.base_ref }}
          CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          CI_HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          class="$(bash scripts/ci-change-class.sh detect)"
          echo "class=${class}" >> "${GITHUB_OUTPUT}"
          echo "Change class: \`${class}\`" >> "${GITHUB_STEP_SUMMARY}"

  # The gates that read documentation and browser-presentation sources without
  # building the product: the repository contract tests, the neutrality and
  # secret scans, the workflow lint, and the release version metadata check.
  # The `full` class runs all of them inside `quality` instead.
  quality-reduced:
    name: quality / reduced
    needs: changes
    if: needs.changes.outputs.class == 'web' || needs.changes.outputs.class == 'docs'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0
          save-if: "false"

      - name: Install workflow lint tools
        uses: ./.github/actions/setup-tools
        with:
          workflow-tools: "true"

      - name: Lint workflows and shell scripts
        run: cargo xtask workflow-lint

      - name: Check neutral test identifiers
        run: cargo xtask check-neutrality

      - name: Check for secret material
        run: cargo xtask check-secrets

      - name: Run the repository contract tests
        run: cargo test -p xtask

      - name: Check release version metadata
        run: |
          bash scripts/test-validate-release-version.sh
          bash scripts/validate-release-version.sh

      # Includes the guard that keeps a file in the docs class only while
      # nothing compiles or bundles it. A web or docs change can add such a
      # consumer, so the guard must run here and not only in the full gate.
      - name: Run the change classifier tests
        run: bash scripts/test-ci-change-class.sh

  quality:
    name: quality
    needs: changes
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install quality-gate tools
        uses: ./.github/actions/setup-tools
        with:
          gate-tools: "true"
          workflow-tools: "true"
          kubernetes-tools: "true"

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: .bun-version

      - name: Run the release validation entrypoint
        env:
          # Pull requests compare against the PR base, merge queue groups
          # against the group's parent commit, and pushes against the previous
          # tip. Without the merge-group term the base would fall through to
          # github.sha and the append-only migration check would compare the
          # group against itself.
          STEWARD_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: cargo xtask ci

      - name: Build governed Connections test artifacts
        run: scripts/package-governed-connections-artifacts.sh

      - name: Retain governed Connections test artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: governed-connections-${{ github.sha }}-${{ github.run_id }}
          path: target/governed-connections-artifacts
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

  conformance-pinned:
    name: conformance / pinned upstream
    needs: changes
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install conformance tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: .bun-version

      - name: Run pinned upstream conformance
        run: cargo xtask conformance --pinned

  openshell-adapter:
    name: integration / OpenShell 0.0.98 adapter
    needs: changes
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Verify the authenticated OpenShell adapter
        run: cargo xtask e2e-openshell-adapter

  governed-connections:
    name: integration / governed MCP provider connections
    needs:
      - changes
      - quality
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Restore governed Connections test artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: governed-connections-${{ github.sha }}-${{ github.run_id }}
          path: target/governed-connections-artifacts

      - name: Prepare governed Connections test artifacts
        run: |
          chmod 0755 \
            target/governed-connections-artifacts/steward-mint-bin \
            target/governed-connections-artifacts/steward-connections-bridge \
            target/governed-connections-artifacts/governed-connections-webhook \
            target/governed-connections-artifacts/governed_connections

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"
          supervisor-tools: "true"

      - name: Verify governed provider connections against the pinned real stack
        env:
          STEWARD_CONNECTIONS_PREBUILT_DIR: ${{ github.workspace }}/target/governed-connections-artifacts
        run: cargo xtask e2e-governed-connections

  postgres-tls:
    name: integration / TLS-required PostgreSQL
    needs: changes
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Verify encrypted PostgreSQL connection and migrations
        run: cargo xtask e2e-postgres-tls

  browser-e2e:
    name: e2e / browser user journeys
    needs: changes
    if: needs.changes.outputs.class == 'full' || needs.changes.outputs.class == 'web'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/browser-e2e/browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install pinned Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: .bun-version

      - name: Install pinned browser runner and Chromium image
        run: |
          bun install --frozen-lockfile
          bunx playwright install --with-deps chromium

      - name: Verify and build browser presentation
        run: |
          bun run web:check
          bun run --cwd web build

      - name: Verify loopback browser journeys
        run: cargo xtask browser-e2e --browser-ready

  codex-reference-runtime:
    name: release / Codex reference runtime
    needs: changes
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Build Codex reference runtime
        run: docker build --platform linux/amd64 --file build/codex-reference.Dockerfile --tag steward-codex-runtime:release-validation .

      - name: Enforce critical Codex reference runtime policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-codex-runtime:release-validation
          trivy-config: security/codex-reference-runtime.trivy.yaml
          format: table
          exit-code: "1"
          severity: CRITICAL

  release-candidate:
    name: release / chart and images
    needs:
      - changes
      - quality
    # `full` waits for the quality gate, as before. `web` skips that gate, so
    # this lane must not inherit the skip.
    if: >-
      ${{
        !cancelled() &&
        (
          (needs.changes.outputs.class == 'full' && needs.quality.result == 'success') ||
          needs.changes.outputs.class == 'web'
        )
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"
          workflow-tools: "true"

      - name: Lint privileged workflows and release scripts
        run: cargo xtask workflow-lint

      - name: Lint exact core and complete source-chart profiles
        run: bash scripts/customer-core-install-e2e.sh --lint-source-chart charts/steward

      - name: Render the chart and build all component images
        run: scripts/validate-release-artifacts.sh --build-images

      - name: Prepare chart vulnerability scan
        run: |
          set -euo pipefail
          version="$(awk '$1 == "version:" { print $2; exit }' charts/steward/Chart.yaml)"
          mkdir -p target/release-candidate/chart
          helm package charts/steward --destination target/release-candidate \
            --version "$version" --app-version "$version"
          tar -xzf "target/release-candidate/steward-$version.tgz" \
            -C target/release-candidate/chart

      - name: Verify Gateway API backend TLS with Envoy Gateway
        run: scripts/steward-gateway-backend-tls-e2e.sh

      - name: Enforce critical apiserver image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-apiserver:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical controller image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-controller:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical mint image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-mint:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical connections bridge image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-bridge:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical web image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-web:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical chart policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: target/release-candidate/chart
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Install release-candidate artifacts in a clean cluster
        run: bash scripts/release-candidate-acceptance.sh

  # The only required status check. Each lane must end the way the change
  # class requires: `success` for a lane the class runs, `skipped` for a lane
  # the class is defined to skip, and nothing else. The table and its tests
  # live in scripts/ci-change-class.sh.
  pinned:
    name: pinned
    if: always()
    needs:
      - changes
      - quality
      - quality-reduced
      - conformance-pinned
      - openshell-adapter
      - governed-connections
      - postgres-tls
      - browser-e2e
      - codex-reference-runtime
      - release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Require every lane the change class runs
        shell: bash
        env:
          CHANGE_CLASS: ${{ needs.changes.outputs.class }}
          CHANGES: ${{ needs.changes.result }}
          QUALITY: ${{ needs.quality.result }}
          QUALITY_REDUCED: ${{ needs.quality-reduced.result }}
          CONFORMANCE: ${{ needs.conformance-pinned.result }}
          OPENSHELL_ADAPTER: ${{ needs.openshell-adapter.result }}
          GOVERNED_CONNECTIONS: ${{ needs.governed-connections.result }}
          POSTGRES_TLS: ${{ needs.postgres-tls.result }}
          BROWSER_E2E: ${{ needs.browser-e2e.result }}
          CODEX_REFERENCE_RUNTIME: ${{ needs.codex-reference-runtime.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
        run: |
          set -euo pipefail
          bash scripts/ci-change-class.sh verdict "${CHANGE_CLASS}" "${CHANGES}" \
            "quality=${QUALITY}" \
            "quality-reduced=${QUALITY_REDUCED}" \
            "conformance-pinned=${CONFORMANCE}" \
            "openshell-adapter=${OPENSHELL_ADAPTER}" \
            "governed-connections=${GOVERNED_CONNECTIONS}" \
            "postgres-tls=${POSTGRES_TLS}" \
            "browser-e2e=${BROWSER_E2E}" \
            "codex-reference-runtime=${CODEX_REFERENCE_RUNTIME}" \
            "release-candidate=${RELEASE_CANDIDATE}"

  latest-nightly:
    name: latest-nightly
    needs: changes
    if: needs.changes.outputs.class == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # "latest" means latest upstream conformance target, not a different Rust release.
      - name: Install Steward Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install latest-upstream conformance tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Install pinned Bun runtime
        uses: oven-sh/setup-bun@ecf28ddc73e819eb6fa29df6b34ef8921c743461 # v2.1.3
        with:
          bun-version-file: .bun-version

      - name: Run informational latest-upstream lane
        id: latest_conformance
        continue-on-error: true
        run: cargo xtask conformance --latest

      - name: Report latest-upstream finding
        if: steps.latest_conformance.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Latest-upstream conformance finding::The latest upstream target does not yet provide the pinned guarantees; inspect the failed conformance step."
          {
            echo "### Latest-upstream conformance finding"
            echo
            echo "The informational latest-upstream test is red."
            echo "The pinned lane remains the merge-blocking source of truth."
            echo "Inspect the failed conformance step for the upstream gap."
          } >> "${GITHUB_STEP_SUMMARY}"
