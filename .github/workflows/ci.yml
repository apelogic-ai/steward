name: ci

on:
  pull_request:
  push:
    branches:
      - main
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install quality-gate tools
        uses: ./.github/actions/setup-tools
        with:
          gate-tools: "true"

      - name: Run quality gates
        env:
          STEWARD_MIGRATION_BASE: ${{ github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before) || github.sha }}
        run: cargo xtask quality

  conformance-pinned:
    name: conformance / pinned upstream
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install conformance tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"
          supervisor-tools: "true"

      - name: Run pinned upstream conformance
        run: cargo xtask conformance --pinned

  e2e-provisioning:
    name: e2e / provisioning lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Verify provisioning and teardown
        run: cargo xtask e2e-s0

  e2e-runtime:
    name: e2e / runtime identity, inference and PoC
    runs-on: ubuntu-latest
    timeout-minutes: 105
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install integration tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"
          supervisor-tools: "true"

      # Keep runtime E2E lanes in one runner so cargo reuses the same target
      # directory instead of recompiling the OpenShell/Mint graph per lane.
      - name: Fail fast on the S5 Mint token-grant contract
        run: >-
          cargo test --locked --package steward-mint
          --test fast_track_mcp_compatibility
          s5_hop1_v3_authority_mints_and_introspects_the_required_mcp_grant
          -- --exact

      - name: Verify workload identity and tool access
        run: cargo xtask e2e-s1

      - name: Verify inference budget enforcement
        run: cargo xtask e2e-s2

      - name: Verify the complete PoC journey and revocation
        run: cargo xtask e2e-s5

  e2e-admission:
    name: e2e / envelope admission
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Verify envelope admission
        run: cargo xtask e2e-s3

  e2e-escalation:
    name: e2e / approvals and grants
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Verify approval and instance-grant enforcement
        run: cargo xtask e2e-s4

  openshell-adapter:
    name: integration / OpenShell 0.0.98 adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Verify the authenticated OpenShell adapter
        run: cargo xtask e2e-openshell-adapter

  postgres-tls:
    name: integration / TLS-required PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Verify encrypted PostgreSQL connection and migrations
        run: cargo xtask e2e-postgres-tls

  browser-e2e:
    name: e2e / browser user journeys
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/target/browser-e2e/browsers
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install pinned Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install pinned browser runner and Chromium image
        run: |
          npm ci
          npm exec playwright install --with-deps chromium

      - name: Verify loopback browser journeys
        run: cargo xtask browser-e2e --browser-ready

  release-candidate:
    name: release / chart and images
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Helm
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"
          workflow-tools: "true"

      - name: Lint privileged workflows and release scripts
        run: |
          actionlint
          shellcheck \
            scripts/openshell-adapter-e2e.sh \
            scripts/promote-ecr-artifact.sh \
            scripts/resolve-ecr-platform-digest.sh \
            scripts/test-promote-ecr-artifact.sh \
            scripts/test-resolve-ecr-platform-digest.sh \
            scripts/validate-release-artifacts.sh

      - name: Render the chart and build all component images
        run: scripts/validate-release-artifacts.sh --build-images

      - name: Enforce critical apiserver image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-apiserver:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical controller image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-controller:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Enforce critical mint image policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: steward-mint:release-validation
          format: table
          exit-code: "1"
          severity: CRITICAL

  pinned:
    name: pinned
    if: always()
    needs:
      - quality
      - conformance-pinned
      - e2e-provisioning
      - e2e-runtime
      - e2e-admission
      - e2e-escalation
      - openshell-adapter
      - postgres-tls
      - browser-e2e
      - release-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every pinned functional lane
        shell: bash
        env:
          QUALITY: ${{ needs.quality.result }}
          CONFORMANCE: ${{ needs.conformance-pinned.result }}
          PROVISIONING: ${{ needs.e2e-provisioning.result }}
          RUNTIME: ${{ needs.e2e-runtime.result }}
          ADMISSION: ${{ needs.e2e-admission.result }}
          ESCALATION: ${{ needs.e2e-escalation.result }}
          OPENSHELL_ADAPTER: ${{ needs.openshell-adapter.result }}
          POSTGRES_TLS: ${{ needs.postgres-tls.result }}
          BROWSER_E2E: ${{ needs.browser-e2e.result }}
          RELEASE_CANDIDATE: ${{ needs.release-candidate.result }}
        run: |
          set -euo pipefail
          for result in \
            "${QUALITY}" \
            "${CONFORMANCE}" \
            "${PROVISIONING}" \
            "${RUNTIME}" \
            "${ADMISSION}" \
            "${ESCALATION}" \
            "${OPENSHELL_ADAPTER}" \
            "${POSTGRES_TLS}" \
            "${BROWSER_E2E}" \
            "${RELEASE_CANDIDATE}"
          do
            if [[ "${result}" != "success" ]]; then
              echo "a required pinned functional lane ended with: ${result}" >&2
              exit 1
            fi
          done

  latest-nightly:
    name: latest-nightly
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # "latest" means latest upstream conformance target, not a different Rust release.
      - name: Install Steward Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Install latest-upstream conformance tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Run informational latest-upstream lane
        id: latest_conformance
        continue-on-error: true
        run: cargo xtask conformance --latest

      - name: Report latest-upstream finding
        if: steps.latest_conformance.outcome == 'failure'
        shell: bash
        run: |
          echo "::warning title=Latest-upstream conformance finding::The latest upstream target does not yet provide the pinned guarantees; inspect the failed conformance step."
          {
            echo "### Latest-upstream conformance finding"
            echo
            echo "The informational latest-upstream test is red."
            echo "The pinned lane remains the merge-blocking source of truth."
            echo "Inspect the failed conformance step for the upstream gap."
          } >> "${GITHUB_STEP_SUMMARY}"
