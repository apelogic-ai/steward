name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Install release validation tools
        uses: ./.github/actions/setup-tools
        with:
          gate-tools: "true"
          kubernetes-tools: "true"
          supervisor-tools: "true"
          workflow-tools: "true"

      - name: Lint privileged workflows and release scripts
        run: |
          actionlint
          shellcheck \
            scripts/postgres-tls-e2e.sh \
            scripts/postgres-tls-init.sh \
            scripts/promote-ecr-artifact.sh \
            scripts/resolve-ecr-platform-digest.sh \
            scripts/test-promote-ecr-artifact.sh \
            scripts/test-resolve-ecr-platform-digest.sh \
            scripts/validate-release-artifacts.sh

      - name: Run Steward quality gates
        env:
          STEWARD_MIGRATION_BASE: ${{ github.sha }}
        run: cargo xtask ci

      - name: Verify encrypted PostgreSQL connection and migrations
        run: cargo xtask e2e-postgres-tls

      - name: Validate Helm chart contract
        run: scripts/validate-release-artifacts.sh

  publish-images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - component: apiserver
            binary: steward-apiserver-bin
          - component: controller
            binary: steward-controller-bin
          - component: mint
            binary: steward-mint-bin
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable component image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: build/package.Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/steward:${{ steps.version.outputs.version }}-${{ matrix.component }}
          build-args: BINARY=${{ matrix.binary }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=steward-${{ matrix.component }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=steward-release-build
          cache-to: type=gha,mode=max,scope=steward-release-build

      - name: Record image digest
        run: |
          mkdir -p dist
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'dist/${{ matrix.component }}.digest'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/steward@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/steward@${{ steps.build.outputs.digest }}
          format: json
          output: dist/${{ matrix.component }}.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Retain complete image vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}-vulnerability-report
          path: dist/${{ matrix.component }}.vulnerabilities.json
          if-no-files-found: error

      - name: Enforce critical image vulnerability policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/steward@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/steward
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload image release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}
          path: dist/*
          if-no-files-found: error

  publish-chart:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Log in to GHCR for Helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Log in to GHCR for provenance
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish OCI chart
        id: chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist "$RUNNER_TEMP/chart-scan"
          helm package charts/steward --destination dist --version "$version" --app-version "$version"
          tar -xzf "dist/steward-$version.tgz" -C "$RUNNER_TEMP/chart-scan"
          push_output="$(helm push "dist/steward-$version.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/charts')"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" {print $2}')"
          test -n "$digest"
          printf '%s\n' "$digest" > dist/helm-chart.digest
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ runner.temp }}/chart-scan
          format: spdx-json
          output-file: dist/helm-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate chart vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: json
          output: dist/helm-chart.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Retain complete chart vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart-vulnerability-report
          path: dist/helm-chart.vulnerabilities.json
          if-no-files-found: error

      - name: Enforce critical chart vulnerability policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/steward
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Upload chart release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart
          path: dist/*
          if-no-files-found: error

  promote-ecr:
    needs: [publish-images, publish-chart]
    if: ${{ vars.ECR_PROMOTION_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
      id-token: write
      attestations: write
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      ECR_REGISTRY: ${{ vars.ECR_REGISTRY }}
      STEWARD_ECR_IMAGE_REPOSITORY: ${{ vars.STEWARD_ECR_IMAGE_REPOSITORY }}
      STEWARD_ECR_CHART_REPOSITORY: ${{ vars.STEWARD_ECR_CHART_REPOSITORY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up ORAS
        uses: oras-project/setup-oras@4fb5323ce5e4debde6f8fe277e461b0815a75992
        with:
          version: 1.3.3

      - name: Install Cosign
        uses: sigstore/cosign-installer@874852de93c66509b01dc7cd80f7a5385182d017
        with:
          cosign-release: v3.1.2

      - name: Download approved release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Validate private registry coordinates
        env:
          AWS_RELEASE_ROLE_ARN: ${{ vars.AWS_RELEASE_ROLE_ARN }}
        run: |
          set -euo pipefail
          : "${AWS_RELEASE_ROLE_ARN:?Set AWS_RELEASE_ROLE_ARN}"
          : "${AWS_REGION:?Set AWS_REGION}"
          : "${ECR_REGISTRY:?Set ECR_REGISTRY}"
          : "${STEWARD_ECR_IMAGE_REPOSITORY:?Set STEWARD_ECR_IMAGE_REPOSITORY}"
          : "${STEWARD_ECR_CHART_REPOSITORY:?Set STEWARD_ECR_CHART_REPOSITORY}"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c
        with:
          role-to-assume: ${{ vars.AWS_RELEASE_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: steward-release-${{ github.run_id }}

      - name: Authenticate registries
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' "$GH_TOKEN" | oras login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          aws ecr get-login-password --region "$AWS_REGION" \
            | oras login "$ECR_REGISTRY" --username AWS --password-stdin

      - name: Promote exact approved manifests
        id: promote
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          image_repository="$ECR_REGISTRY/$STEWARD_ECR_IMAGE_REPOSITORY"
          chart_repository="$ECR_REGISTRY/$STEWARD_ECR_CHART_REPOSITORY"
          for component in apiserver controller mint; do
            source_digest="$(cat "dist/$component.digest")"
            source="ghcr.io/$GITHUB_REPOSITORY_OWNER/steward@$source_digest"
            scripts/promote-ecr-artifact.sh \
              "$source" \
              "$ECR_REGISTRY" \
              "$STEWARD_ECR_IMAGE_REPOSITORY" \
              "$version-$component" \
              "$source_digest"
            printf '%s\n' "$source_digest" > "dist/ecr-$component.digest"
          done
          source_chart_digest="$(cat dist/helm-chart.digest)"
          scripts/promote-ecr-artifact.sh \
            "ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/steward@$source_chart_digest" \
            "$ECR_REGISTRY" \
            "$STEWARD_ECR_CHART_REPOSITORY" \
            "$version" \
            "$source_chart_digest"
          printf '%s\n' "$source_chart_digest" > dist/ecr-helm-chart.digest
          {
            printf 'image-repository=%s\n' "$image_repository"
            printf 'chart-repository=%s\n' "$chart_repository"
            printf 'apiserver-digest=%s\n' "$(cat dist/ecr-apiserver.digest)"
            printf 'controller-digest=%s\n' "$(cat dist/ecr-controller.digest)"
            printf 'mint-digest=%s\n' "$(cat dist/ecr-mint.digest)"
            printf 'chart-digest=%s\n' "$source_chart_digest"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for and enforce native ECR image scans
        run: |
          set -euo pipefail
          scan_failed=0
          for component in apiserver controller mint; do
            index_digest="$(cat "dist/ecr-$component.digest")"
            index_ref="$ECR_REGISTRY/$STEWARD_ECR_IMAGE_REPOSITORY@$index_digest"
            if ! platform_digest="$(scripts/resolve-ecr-platform-digest.sh \
              "$index_ref" linux amd64)"
            then
              echo "runnable linux/amd64 manifest resolution failed for $component@$index_digest" >&2
              scan_failed=1
              continue
            fi
            printf '%s\n' "$platform_digest" > "dist/ecr-$component-scan-platform.digest"
            report="dist/ecr-$component-scan.json"
            if ! aws ecr wait image-scan-complete \
              --repository-name "$STEWARD_ECR_IMAGE_REPOSITORY" \
              --image-id "imageDigest=$platform_digest"
            then
              echo "ECR scan did not complete for $component platform $platform_digest (index $index_digest)" >&2
              scan_failed=1
              continue
            fi
            if ! aws ecr describe-image-scan-findings \
              --repository-name "$STEWARD_ECR_IMAGE_REPOSITORY" \
              --image-id "imageDigest=$platform_digest" \
              --output json > "$report"
            then
              echo "ECR scan findings were unavailable for $component platform $platform_digest (index $index_digest)" >&2
              scan_failed=1
              continue
            fi
            critical="$(jq '[
              .imageScanFindings.findingSeverityCounts.CRITICAL // 0,
              ([.imageScanFindings.enhancedFindings[]? | select(.severity == "CRITICAL")] | length)
            ] | max' "$report")"
            if [[ "$critical" -ne 0 ]]; then
              echo "ECR reported $critical critical findings for $component platform $platform_digest (index $index_digest)" >&2
              scan_failed=1
            fi
          done
          test "$scan_failed" -eq 0

      - name: Retain native ECR scan evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ecr-release-scan-evidence
          path: dist/ecr-*-scan.*
          if-no-files-found: warn

      - name: Sign promoted artifacts
        env:
          IMAGE_REPOSITORY: ${{ steps.promote.outputs['image-repository'] }}
          CHART_REPOSITORY: ${{ steps.promote.outputs['chart-repository'] }}
        run: |
          set -euo pipefail
          for component in apiserver controller mint; do
            digest="$(cat "dist/ecr-$component.digest")"
            cosign sign --yes \
              --output-signature "dist/ecr-$component.sig" \
              --output-certificate "dist/ecr-$component.pem" \
              "$IMAGE_REPOSITORY@$digest"
          done
          cosign sign --yes \
            --output-signature dist/ecr-helm-chart.sig \
            --output-certificate dist/ecr-helm-chart.pem \
            "$CHART_REPOSITORY@${{ steps.promote.outputs['chart-digest'] }}"

      - name: Attest promoted apiserver provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.promote.outputs['image-repository'] }}
          subject-digest: ${{ steps.promote.outputs['apiserver-digest'] }}
          push-to-registry: true

      - name: Attest promoted controller provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.promote.outputs['image-repository'] }}
          subject-digest: ${{ steps.promote.outputs['controller-digest'] }}
          push-to-registry: true

      - name: Attest promoted mint provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.promote.outputs['image-repository'] }}
          subject-digest: ${{ steps.promote.outputs['mint-digest'] }}
          push-to-registry: true

      - name: Attest promoted chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ${{ steps.promote.outputs['chart-repository'] }}
          subject-digest: ${{ steps.promote.outputs['chart-digest'] }}
          push-to-registry: true

      - name: Generate private registry handoff
        env:
          IMAGE_REPOSITORY: ${{ steps.promote.outputs['image-repository'] }}
          CHART_REPOSITORY: ${{ steps.promote.outputs['chart-repository'] }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          {
            printf '# Steward private registry handoff %s\n\n' "$version"
            printf 'Release commit: %s\n\n' "$GITHUB_SHA"
            printf '| Artifact | Immutable reference | Scanned linux/amd64 digest |\n|---|---|---|\n'
            for component in apiserver controller mint; do
              printf '| %s | %s:%s-%s@%s | %s |\n' \
                "$component" "$IMAGE_REPOSITORY" "$version" "$component" \
                "$(cat "dist/ecr-$component.digest")" \
                "$(cat "dist/ecr-$component-scan-platform.digest")"
            done
            printf '| chart | oci://%s@%s | n/a |\n' \
              "$CHART_REPOSITORY" "$(cat dist/ecr-helm-chart.digest)"
          } > dist/ecr-release-handoff.md

      - name: Upload private registry handoff
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: ecr-release-handoff
          path: dist/ecr-*
          if-no-files-found: error

  release:
    needs: [publish-images, publish-chart, promote-ecr]
    if: >-
      ${{
        always() &&
        needs.publish-images.result == 'success' &&
        needs.publish-chart.result == 'success' &&
        (needs.promote-ecr.result == 'success' || needs.promote-ecr.result == 'skipped')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Download release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: "*release*"
          path: dist
          merge-multiple: true

      - name: Generate public release handoff
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/steward"
          chart="ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/steward"
          {
            printf '# Steward release %s\n\n' "$version"
            printf 'Release commit: %s\n\n' "$GITHUB_SHA"
            printf '| Artifact | Tag | Digest |\n|---|---|---|\n'
            for component in apiserver controller mint; do
              printf '| %s | %s:%s-%s | %s |\n' \
                "$component" "$repository" "$version" "$component" "$(cat "dist/$component.digest")"
            done
            printf '| chart | oci://%s:%s | %s |\n' \
              "$chart" "$version" "$(cat dist/helm-chart.digest)"
            printf '\nEach image and the chart includes an SPDX SBOM, a vulnerability report, and GitHub artifact provenance.\n'
          } > dist/release-handoff.md

      - name: Verify public artifact access
        run: |
          set -euo pipefail
          for component in apiserver controller mint; do
            docker buildx imagetools inspect \
              "ghcr.io/$GITHUB_REPOSITORY_OWNER/steward@$(cat "dist/$component.digest")"
          done
          helm pull "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/steward" \
            --version "${GITHUB_REF_NAME#v}" \
            --destination "$RUNNER_TEMP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file dist/release-handoff.md
