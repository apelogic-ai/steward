name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Require release commit on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt

      - name: Install release validation tools
        uses: ./.github/actions/setup-tools
        with:
          gate-tools: "true"
          kubernetes-tools: "true"
          workflow-tools: "true"

      - name: Lint privileged workflows and release scripts
        run: |
          actionlint
          shellcheck \
            scripts/postgres-tls-e2e.sh \
            scripts/postgres-tls-init.sh \
            scripts/codex-reference-runtime-conformance.sh \
            scripts/codex-reference-runtime-openshell-inside.sh \
            scripts/package-provider-profile-bundle.sh \
            scripts/package-platform-preflight.sh \
            scripts/test-package-provider-profile-bundle.sh \
            scripts/test-package-platform-preflight.sh \
            scripts/steward-registry-lock.sh \
            scripts/test-steward-registry-lock.sh \
            scripts/steward-registry-lock-live-conformance.sh \
            scripts/test-released-artifact-acceptance.sh \
            scripts/test-validate-release-version.sh \
            scripts/validate-release-version.sh \
            scripts/customer-core-install-e2e.sh \
            scripts/validate-release-artifacts.sh

      - name: Run Steward quality gates
        env:
          STEWARD_MIGRATION_BASE: ${{ github.sha }}
        run: cargo xtask ci

      - name: Verify encrypted PostgreSQL connection and migrations
        run: cargo xtask e2e-postgres-tls

      - name: Validate Helm chart contract
        env:
          STEWARD_RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          STEWARD_RELEASE_VERSION="${STEWARD_RELEASE_VERSION#v}" \
            scripts/validate-release-artifacts.sh

  publish-images:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        include:
          - component: apiserver
            binary: steward-apiserver-bin
            dockerfile: build/package.Dockerfile
          - component: controller
            binary: steward-controller-bin
            dockerfile: build/package.Dockerfile
          - component: mint
            binary: steward-mint-bin
            dockerfile: build/package.Dockerfile
          - component: bridge
            binary: steward-connections-bridge
            dockerfile: build/connections-bridge.Dockerfile
          - component: web
            binary: ""
            dockerfile: build/web.Dockerfile
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish immutable component image
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/steward:${{ steps.version.outputs.version }}-${{ matrix.component }}
          build-args: BINARY=${{ matrix.binary }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.title=steward-${{ matrix.component }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=steward-release-build
          cache-to: type=gha,mode=max,scope=steward-release-build

      - name: Record image digest
        run: |
          mkdir -p dist
          printf '%s\n' '${{ steps.build.outputs.digest }}' > 'dist/${{ matrix.component }}.digest'

      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/steward@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/${{ matrix.component }}.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/steward@${{ steps.build.outputs.digest }}
          format: json
          output: dist/${{ matrix.component }}.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Retain complete image vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}-vulnerability-report
          path: dist/${{ matrix.component }}.vulnerabilities.json
          if-no-files-found: error

      - name: Enforce critical image vulnerability policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/steward@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest image provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/steward
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload image release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-${{ matrix.component }}
          path: dist/*
          if-no-files-found: error

  publish-codex-reference-runtime:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve release version
        id: version
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build and publish Codex reference runtime
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: .
          file: build/codex-reference.Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/steward-codex-runtime:0.140.0-steward-${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=0.140.0-steward-${{ steps.version.outputs.version }}
            org.opencontainers.image.title=steward-codex-runtime
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=steward-codex-reference-runtime
          cache-to: type=gha,mode=max,scope=steward-codex-reference-runtime

      - name: Record Codex reference runtime digest
        run: |
          mkdir -p dist
          printf '%s\n' '${{ steps.build.outputs.digest }}' > dist/codex-reference-runtime.digest

      - name: Generate Codex reference runtime SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          image: ghcr.io/${{ github.repository_owner }}/steward-codex-runtime@${{ steps.build.outputs.digest }}
          registry-username: ${{ github.actor }}
          registry-password: ${{ secrets.GITHUB_TOKEN }}
          format: spdx-json
          output-file: dist/codex-reference-runtime.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate Codex reference runtime vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/steward-codex-runtime@${{ steps.build.outputs.digest }}
          format: json
          output: dist/codex-reference-runtime.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Retain Codex reference runtime vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-codex-reference-runtime-vulnerability-report
          path: dist/codex-reference-runtime.vulnerabilities.json
          if-no-files-found: error

      - name: Enforce critical Codex reference runtime vulnerability policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: ghcr.io/${{ github.repository_owner }}/steward-codex-runtime@${{ steps.build.outputs.digest }}
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest Codex reference runtime provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/steward-codex-runtime
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Upload Codex reference runtime evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-codex-reference-runtime
          path: |
            dist/codex-reference-runtime.digest
            dist/codex-reference-runtime.spdx.json
          if-no-files-found: error

  publish-provider-profile-bundle:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        id: version
        run: printf 'version=%s\n' "${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Build standalone provider-profile installer
        run: cargo build --locked --release --package xtask --bin steward-provider-profile

      - name: Package immutable provider-profile bundle
        run: |
          set -euo pipefail
          mkdir -p dist
          scripts/package-provider-profile-bundle.sh \
            --version '${{ steps.version.outputs.version }}' \
            --installer target/release/steward-provider-profile \
            --installer-os linux \
            --installer-architecture amd64 \
            --output dist

      - name: Attest provider-profile bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/steward-runtime-providers-${{ steps.version.outputs.version }}.tar.gz

      - name: Upload provider-profile bundle release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-provider-profile-bundle
          path: |
            dist/steward-runtime-providers-${{ steps.version.outputs.version }}.tar.gz
            dist/provider-profile-bundle.digest
          if-no-files-found: error

  codex-reference-runtime-conformance:
    needs: [publish-codex-reference-runtime, publish-provider-profile-bundle]
    name: release / Codex reference runtime
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Download Codex runtime evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-codex-reference-runtime
          path: dist

      - name: Download provider-profile evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          name: release-provider-profile-bundle
          path: dist

      - name: Verify Codex runtime and released provider-profile compatibility
        run: |
          version="${GITHUB_REF_NAME#v}"
          scripts/codex-reference-runtime-conformance.sh \
            --image "ghcr.io/$GITHUB_REPOSITORY_OWNER/steward-codex-runtime@$(cat dist/codex-reference-runtime.digest)" \
            --provider-profile-bundle "dist/steward-runtime-providers-${version}.tar.gz"

  publish-platform-preflight-bundle:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Resolve release version
        id: platform-preflight-version
        run: |
          version="${GITHUB_REF_NAME#v}"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Package platform preflight bundle
        run: scripts/package-platform-preflight.sh '${{ steps.platform-preflight-version.outputs.version }}' dist

      - name: Attest platform preflight bundle provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/steward-platform-preflight-${{ steps.platform-preflight-version.outputs.version }}.tar.gz

      - name: Upload platform preflight release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-platform-preflight-bundle
          path: |
            dist/steward-platform-preflight-*.tar.gz
            dist/platform-preflight-bundle.digest
          if-no-files-found: error

  registry-mirror-conformance:
    needs: validate
    name: release / live registry mirror
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install daemonless OCI tools
        uses: ./.github/actions/setup-tools
        with:
          oci-tools: "true"

      - name: Prove multi-platform registry mirroring
        run: scripts/steward-registry-lock-live-conformance.sh

  openshell-x86-conformance:
    needs: validate
    name: release / linux-amd64 OpenShell adapter
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal

      - name: Restore shared Rust build cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          shared-key: steward-rust-1.95.0

      - name: Install Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Verify authenticated OpenShell adapter on linux/amd64
        run: cargo xtask e2e-openshell-adapter

  publish-chart:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Log in to GHCR for Helm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$GH_TOKEN" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Log in to GHCR for provenance
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and publish OCI chart
        id: chart
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist "$RUNNER_TEMP/chart-scan"
          helm package charts/steward --destination dist --version "$version" --app-version "$version"
          tar -xzf "dist/steward-$version.tgz" -C "$RUNNER_TEMP/chart-scan"
          push_output="$(helm push "dist/steward-$version.tgz" 'oci://ghcr.io/${{ github.repository_owner }}/charts')"
          printf '%s\n' "$push_output"
          digest="$(printf '%s\n' "$push_output" | awk '$1 == "Digest:" {print $2}')"
          test -n "$digest"
          printf '%s\n' "$digest" > dist/helm-chart.digest
          printf 'digest=%s\n' "$digest" >> "$GITHUB_OUTPUT"

      - name: Generate chart SPDX SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610
        with:
          path: ${{ runner.temp }}/chart-scan
          format: spdx-json
          output-file: dist/helm-chart.spdx.json
          upload-artifact: false
          upload-release-assets: false

      - name: Generate chart vulnerability report
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: json
          output: dist/helm-chart.vulnerabilities.json
          exit-code: "0"
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL

      - name: Retain complete chart vulnerability report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart-vulnerability-report
          path: dist/helm-chart.vulnerabilities.json
          if-no-files-found: error

      - name: Enforce critical chart vulnerability policy
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          scan-type: fs
          scan-ref: ${{ runner.temp }}/chart-scan
          format: table
          exit-code: "1"
          severity: CRITICAL

      - name: Attest chart provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/charts/steward
          subject-digest: ${{ steps.chart.outputs.digest }}
          push-to-registry: true

      - name: Upload chart release evidence
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: release-helm-chart
          path: dist/*
          if-no-files-found: error

  released-artifact-acceptance:
    needs: [publish-images, publish-chart]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install pinned Kubernetes tools
        uses: ./.github/actions/setup-tools
        with:
          kubernetes-tools: "true"

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download published artifact digests
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Install released core profile in a clean cluster
        env:
          STEWARD_RELEASE_IMAGE_REPOSITORY: ghcr.io/${{ github.repository_owner }}/steward
          STEWARD_RELEASE_CHART_REPOSITORY: oci://ghcr.io/${{ github.repository_owner }}/charts/steward
        run: |
          set -euo pipefail
          STEWARD_RELEASE_VERSION="${GITHUB_REF_NAME#v}"
          STEWARD_RELEASE_CHART_DIGEST="$(cat dist/helm-chart.digest)"
          STEWARD_RELEASE_APISERVER_DIGEST="$(cat dist/apiserver.digest)"
          STEWARD_RELEASE_CONTROLLER_DIGEST="$(cat dist/controller.digest)"
          STEWARD_RELEASE_MINT_DIGEST="$(cat dist/mint.digest)"
          STEWARD_RELEASE_BRIDGE_DIGEST="$(cat dist/bridge.digest)"
          STEWARD_RELEASE_WEB_DIGEST="$(cat dist/web.digest)"
          export STEWARD_RELEASE_VERSION STEWARD_RELEASE_CHART_DIGEST
          export STEWARD_RELEASE_APISERVER_DIGEST STEWARD_RELEASE_CONTROLLER_DIGEST
          export STEWARD_RELEASE_MINT_DIGEST STEWARD_RELEASE_BRIDGE_DIGEST
          export STEWARD_RELEASE_WEB_DIGEST
          bash scripts/customer-core-install-e2e.sh

  release:
    needs: [publish-images, publish-provider-profile-bundle, publish-codex-reference-runtime, codex-reference-runtime-conformance, publish-platform-preflight-bundle, registry-mirror-conformance, openshell-x86-conformance, publish-chart, released-artifact-acceptance]
    if: >-
      ${{
        always() &&
        needs.publish-images.result == 'success' &&
        needs.publish-provider-profile-bundle.result == 'success' &&
        needs.publish-codex-reference-runtime.result == 'success' &&
        needs.codex-reference-runtime-conformance.result == 'success' &&
        needs.publish-platform-preflight-bundle.result == 'success' &&
        needs.registry-mirror-conformance.result == 'success' &&
        needs.openshell-x86-conformance.result == 'success' &&
        needs.publish-chart.result == 'success' &&
        needs.released-artifact-acceptance.result == 'success'
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: read
      id-token: write
      attestations: write
    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Set up Helm
        uses: azure/setup-helm@bf6a7d304bc2fdb57e0331155b7ebf2c504acf0a

      - name: Log in to GHCR for bridge provenance bundle
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download release evidence
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131
        with:
          pattern: "*release*"
          path: dist
          merge-multiple: true

      - name: Download immutable bridge provenance bundle
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bridge_digest="$(cat dist/bridge.digest)"
          gh attestation download \
            "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/steward@$bridge_digest" \
            --repo "$GITHUB_REPOSITORY" \
            --predicate-type https://slsa.dev/provenance/v1
          bundle_file="${bridge_digest}.jsonl"
          test -s "$bundle_file"
          mv "$bundle_file" dist/bridge-attestation-bundle.jsonl

      - name: Generate public release handoff
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          test "$version" = "0.2.3"
          repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/steward"
          codex_repository="ghcr.io/$GITHUB_REPOSITORY_OWNER/steward-codex-runtime"
          chart="ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/steward"
          bridge_digest="$(cat dist/bridge.digest)"
          codex_digest="$(cat dist/codex-reference-runtime.digest)"
          provider_profile_bundle_asset="steward-runtime-providers-${version}.tar.gz"
          provider_profile_bundle_digest="$(cat dist/provider-profile-bundle.digest)"
          platform_preflight_bundle_digest="$(cat dist/platform-preflight-bundle.digest)"
          bridge_signer_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          bridge_source_repository="https://github.com/$GITHUB_REPOSITORY"
          mirror_asset="steward-registry-lock.sh"
          install -m 0755 scripts/steward-registry-lock.sh "dist/$mirror_asset"
          mirror_digest="sha256:$(sha256sum "dist/$mirror_asset" | awk '{print $1}')"
          (cd dist && sha256sum "$mirror_asset" > "${mirror_asset}.sha256")
          compatibility_asset="steward-governed-platform-compatibility-${version}.json"
          jq \
            --arg version "$version" \
            --arg commit "$GITHUB_SHA" \
            --arg chart_reference "oci://${chart}:${version}" \
            --arg chart_digest "$(cat dist/helm-chart.digest)" \
            --arg image_repository "$repository" \
            --arg apiserver_digest "$(cat dist/apiserver.digest)" \
            --arg controller_digest "$(cat dist/controller.digest)" \
            --arg mint_digest "$(cat dist/mint.digest)" \
            --arg bridge_digest "$bridge_digest" \
            --arg web_digest "$(cat dist/web.digest)" \
            '.steward = {
              version: $version,
              commit: $commit,
              chart: {reference: $chart_reference, digest: $chart_digest},
              images: {
                apiserver: {reference: ($image_repository + ":" + $version + "-apiserver"), digest: $apiserver_digest},
                controller: {reference: ($image_repository + ":" + $version + "-controller"), digest: $controller_digest},
                mint: {reference: ($image_repository + ":" + $version + "-mint"), digest: $mint_digest},
                bridge: {reference: ($image_repository + ":" + $version + "-bridge"), digest: $bridge_digest},
                web: {reference: ($image_repository + ":" + $version + "-web"), digest: $web_digest}
              }
            }' config/governed-platform/v1/compatibility.json > "dist/$compatibility_asset"
          compatibility_digest="sha256:$(sha256sum "dist/$compatibility_asset" | awk '{print $1}')"
          (cd dist && sha256sum "$compatibility_asset" > "${compatibility_asset}.sha256")
          jq -n \
            --arg version "$version" \
            --arg commit "$GITHUB_SHA" \
            --arg chart_reference "oci://${chart}:${version}" \
            --arg chart_digest "$(cat dist/helm-chart.digest)" \
            --arg image_repository "$repository" \
            --arg codex_reference "${codex_repository}:0.140.0-steward-${version}" \
            --arg codex_digest "$codex_digest" \
            --arg apiserver_digest "$(cat dist/apiserver.digest)" \
            --arg controller_digest "$(cat dist/controller.digest)" \
            --arg mint_digest "$(cat dist/mint.digest)" \
            --arg bridge_digest "$bridge_digest" \
            --arg web_digest "$(cat dist/web.digest)" \
            --arg provider_digest "$provider_profile_bundle_digest" \
            --arg mirror_asset "$mirror_asset" \
            --arg mirror_digest "$mirror_digest" \
            --arg compatibility_asset "$compatibility_asset" \
            --arg compatibility_digest "$compatibility_digest" \
            --arg platform_preflight_digest "$platform_preflight_bundle_digest" \
            '{
              schemaVersion: "steward.release-handoff/v1",
              version: $version,
              commit: $commit,
              authorityContract: "user-envelope-only",
              identityPolicyContract: "github-oidc-exchange.apelogic.io/v5",
              chart: {
                reference: $chart_reference,
                digest: $chart_digest
              },
              images: {
                apiserver: {reference: ($image_repository + ":" + $version + "-apiserver"), digest: $apiserver_digest},
                controller: {reference: ($image_repository + ":" + $version + "-controller"), digest: $controller_digest},
                mint: {reference: ($image_repository + ":" + $version + "-mint"), digest: $mint_digest},
                bridge: {reference: ($image_repository + ":" + $version + "-bridge"), digest: $bridge_digest},
                web: {reference: ($image_repository + ":" + $version + "-web"), digest: $web_digest}
              },
              referenceRuntimes: {
                codex: {
                  agentRef: "codex@0.140.0",
                  version: "0.140.0",
                  reference: $codex_reference,
                  digest: $codex_digest,
                  platform: "linux/amd64"
                }
              },
              providerProfileBundle: {
                identity: "steward-runtime-providers@1.2.0",
                digest: $provider_digest,
                installer: {
                  path: "provider-profile-bundle/v1.2.0/bin/steward-provider-profile",
                  os: "linux",
                  architecture: "amd64"
                }
              },
              registryMirror: {
                asset: $mirror_asset,
                digest: $mirror_digest,
                lockSchema: "steward.deployment-lock/v1"
              },
              governedPlatformCompatibility: {
                schemaVersion: "steward.governed-platform-compatibility/v1",
                asset: $compatibility_asset,
                digest: $compatibility_digest
              },
              platformPreflightBundle: {
                identity: "steward.platform-preflight/v1",
                asset: ("steward-platform-preflight-" + $version + ".tar.gz"),
                digest: $platform_preflight_digest
              },
              migrations: ["0039_user_envelope_only_task_authority.sql"],
              serviceEnvelopeSupported: false
            }' > dist/release-handoff.json
          {
            printf '# Steward release %s\n\n' "$version"
            printf 'Release commit: %s\n\n' "$GITHUB_SHA"
            printf '## Highlights\n\n'
            printf 'Steward v0.2.3 publishes one exact governed-platform compatibility contract, uses a named MCP-GW authority selector, and ships a daemonless image-and-chart mirror with explicit planning and Flux-ready deployment locks.\n\n'
            printf 'Required image inputs now reject all-zero placeholder digests before deployment or runtime provisioning.\n\n'
            printf 'The chart can project an existing Secret- or ConfigMap-backed PostgreSQL CA into both database consumers for sslmode=verify-full.\n\n'
            printf 'The provider-profile release bundle now includes a standalone linux/amd64 validator and installer with deterministic output and machine-readable evidence.\n\n'
            printf 'The release includes a daemonless ORAS mirror for the OCI chart, component images, and reference runtimes, with explicit planning, collision-safe resume, target digest verification, and a deterministic credential-free deployment lock.\n\n'
            printf 'The release includes one attested compatibility manifest with exact Steward, companion-product, OpenShell, agent-sandbox, SPIRE, MCP-GW, and LiteLLM coordinates and contracts.\n\n'
            printf 'The release includes a supported linux/amd64 Codex 0.140.0 reference runtime, with its immutable digest, SBOM, provenance, and provider-profile conformance evidence.\n\n'
            printf '## Upgrade prerequisites and rollback\n\n'
            printf 'Before migration 0039, terminalize and finalize every unfinished legacy Task that lacks a complete User Envelope or internal-authority pin. Use Identity v0.5.0 with policy contract github-oidc-exchange.apelogic.io/v5, remove Service Envelope bootstrap configuration, and configure the non-authoritative capability catalog.\n\n'
            printf 'Rollback from v0.2.3 to v0.2.2 requires no database rollback because this patch adds no migration. The v0.1.23 rollback boundary remains unchanged; see docs/installation/upgrade-v0.2.0.md.\n\n'
            printf '## Acceptance\n\n'
            printf 'Repository validation, migration rehearsal, image/chart publication, OpenShell conformance, released-artifact installation, scans, SBOMs, and provenance completed successfully before this handoff job.\n\n'
            printf '| Artifact | Tag | Digest |\n|---|---|---|\n'
            for component in apiserver controller mint bridge web; do
              printf '| %s | %s:%s-%s | %s |\n' \
                "$component" "$repository" "$version" "$component" "$(cat "dist/$component.digest")"
            done
            printf '| chart | oci://%s:%s | %s |\n' \
              "$chart" "$version" "$(cat dist/helm-chart.digest)"
            printf '\n## Reference runtimes\n\n'
            printf '| Agent | Platform | Reference | Digest |\n|---|---|---|---|\n'
            printf '| codex@0.140.0 | linux/amd64 | %s:0.140.0-steward-%s | %s |\n' \
              "$codex_repository" "$version" "$codex_digest"
            printf '\n## Stable bridge provenance inputs\n\n'
            printf 'Bridge image: %s@%s\n\n' "$repository" "$bridge_digest"
            printf 'Bridge signer identity: %s\n\n' "$bridge_signer_identity"
            printf 'Bridge source repository: %s\n\n' "$bridge_source_repository"
            printf 'Bridge source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Bridge attestation bundle: bridge-attestation-bundle.jsonl\n\n'
            printf '\n## Provider-profile bundle provenance inputs\n\n'
            printf 'Provider profile bundle asset: %s\n\n' "$provider_profile_bundle_asset"
            printf 'Provider profile bundle identity: steward-runtime-providers@1.2.0\n\n'
            printf 'Provider profile bundle SHA-256: %s\n\n' "$provider_profile_bundle_digest"
            printf 'Provider profile bundle signer identity: %s\n\n' "$bridge_signer_identity"
            printf 'Provider profile bundle source repository: %s\n\n' "$bridge_source_repository"
            printf 'Provider profile bundle source commit: %s\n\n' "$GITHUB_SHA"
            printf 'Provider profile installer: provider-profile-bundle/v1.2.0/bin/steward-provider-profile (linux/amd64)\n\n'
            printf 'Provider profile bundle verification: pin the SHA-256 above; verify GitHub artifact provenance with this signer identity, repository, tag, and source commit; then verify the downloaded archive SHA-256 before render/install.\n\n'
            printf '\n## Registry mirror and deployment lock\n\n'
            printf 'Mirror tool asset: %s\n\n' "$mirror_asset"
            printf 'Mirror tool SHA-256: %s\n\n' "$mirror_digest"
            printf 'Use the verified release-handoff.json plus an explicit steward.registry-mappings/v1 document; the tool plans and copies the chart, every component image, and every reference runtime, then emits steward.deployment-lock/v1 with Flux-ready chart coordinates.\n\n'
            printf '\n## Governed-platform compatibility\n\n'
            printf 'Compatibility manifest asset: %s\n\n' "$compatibility_asset"
            printf 'Compatibility manifest SHA-256: %s\n\n' "$compatibility_digest"
            printf 'This attested manifest is the exact tested product and dependency combination for this release.\n\n'
            printf '\n## Platform preflight bundle\n\n'
            printf 'Platform preflight asset: steward-platform-preflight-%s.tar.gz\n\n' "$version"
            printf 'Platform preflight identity: steward.platform-preflight/v1\n\n'
            printf 'Platform preflight SHA-256: %s\n\n' "$(cat dist/platform-preflight-bundle.digest)"
            printf 'The bundle generates deterministic Helm/Flux inputs without Secret bodies and emits machine-readable validation diagnostics.\n\n'
            printf '\n## Verification\n\n'
            printf "Verify the release manifest with: \`gh attestation verify release-handoff.json --repo %s --cert-identity %s\`.\n\n" "$GITHUB_REPOSITORY" "$bridge_signer_identity"
            printf "Inspect every image by the exact digest above with \`docker buildx imagetools inspect\`, and pull the chart by its exact digest with \`helm pull\`.\n\n"
            printf "Each image and the chart includes an SPDX SBOM, a vulnerability report, and GitHub artifact provenance. The machine-readable contract is \`release-handoff.json\`; its verification material is \`release-handoff-attestation.jsonl\`.\n"
          } > dist/release-handoff.md

      - name: Attest machine-readable release handoff
        id: attest-release-handoff
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/release-handoff.json

      - name: Archive release handoff verification material
        env:
          BUNDLE_PATH: ${{ steps.attest-release-handoff.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" dist/release-handoff-attestation.jsonl
          gh attestation verify dist/release-handoff.json \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"

      - name: Attest governed-platform compatibility manifest
        id: attest-governed-platform-compatibility
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a
        with:
          subject-path: dist/steward-governed-platform-compatibility-0.2.3.json

      - name: Archive governed-platform compatibility verification material
        env:
          BUNDLE_PATH: ${{ steps.attest-governed-platform-compatibility.outputs.bundle-path }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s "$BUNDLE_PATH"
          cp "$BUNDLE_PATH" dist/steward-governed-platform-compatibility-attestation.jsonl
          gh attestation verify dist/steward-governed-platform-compatibility-0.2.3.json \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"

      - name: Verify public artifact access
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/steward-anonymous-docker
          HELM_REGISTRY_CONFIG: ${{ runner.temp }}/steward-anonymous-helm.json
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          test ! -e "$DOCKER_CONFIG/config.json"
          test ! -e "$HELM_REGISTRY_CONFIG"
          for component in apiserver controller mint bridge web; do
            docker buildx imagetools inspect \
              "ghcr.io/$GITHUB_REPOSITORY_OWNER/steward@$(cat "dist/$component.digest")"
          done
          docker buildx imagetools inspect \
            "ghcr.io/$GITHUB_REPOSITORY_OWNER/steward-codex-runtime@$(cat dist/codex-reference-runtime.digest)"
          helm pull "oci://ghcr.io/$GITHUB_REPOSITORY_OWNER/charts/steward" \
            --version "${GITHUB_REF_NAME#v}" \
            --destination "$RUNNER_TEMP"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --verify-tag \
            --generate-notes \
            --notes-file dist/release-handoff.md

      - name: Verify published provider-profile bundle availability
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="steward-runtime-providers-${version}.tar.gz"
          destination="$RUNNER_TEMP/provider-profile-bundle"
          mkdir -p "$destination"
          gh release download "$GITHUB_REF_NAME" --pattern "$asset" --dir "$destination"
          signer_identity="https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          gh attestation verify "$destination/$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "$signer_identity"
          actual="sha256:$(sha256sum "$destination/$asset" | awk '{print $1}')"
          expected="$(cat dist/provider-profile-bundle.digest)"
          test "$actual" = "$expected"

      - name: Verify published release handoff
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/release-handoff"
          mkdir -p "$destination"
          gh release download "$GITHUB_REF_NAME" \
            --pattern release-handoff.json \
            --pattern release-handoff-attestation.jsonl \
            --dir "$destination"
          cmp dist/release-handoff.json "$destination/release-handoff.json"
          gh attestation verify "$destination/release-handoff.json" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"

      - name: Verify published registry mirror tool
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          destination="$RUNNER_TEMP/registry-mirror"
          mkdir -p "$destination"
          gh release download "$GITHUB_REF_NAME" \
            --pattern steward-registry-lock.sh \
            --pattern steward-registry-lock.sh.sha256 \
            --dir "$destination"
          (cd "$destination" && sha256sum --check steward-registry-lock.sh.sha256)
          cmp scripts/steward-registry-lock.sh "$destination/steward-registry-lock.sh"
          actual="sha256:$(sha256sum "$destination/steward-registry-lock.sh" | awk '{print $1}')"
          expected="$(jq -r '.registryMirror.digest' dist/release-handoff.json)"
          test "$actual" = "$expected"

      - name: Verify published governed-platform compatibility manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          asset="steward-governed-platform-compatibility-${version}.json"
          destination="$RUNNER_TEMP/governed-platform-compatibility"
          mkdir -p "$destination"
          gh release download "$GITHUB_REF_NAME" \
            --pattern "$asset" \
            --pattern "${asset}.sha256" \
            --pattern steward-governed-platform-compatibility-attestation.jsonl \
            --dir "$destination"
          (cd "$destination" && sha256sum --check "${asset}.sha256")
          cmp "dist/$asset" "$destination/$asset"
          gh attestation verify "$destination/$asset" \
            --repo "$GITHUB_REPOSITORY" \
            --cert-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/release.yml@refs/tags/$GITHUB_REF_NAME"
          actual="sha256:$(sha256sum "$destination/$asset" | awk '{print $1}')"
          expected="$(jq -r '.governedPlatformCompatibility.digest' dist/release-handoff.json)"
          test "$actual" = "$expected"
